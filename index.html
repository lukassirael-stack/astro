<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">

<title>Nebeský kalendář</title>
<meta name="description" content="Nebeský kalendář – osobní kalendář složený z postavení planet, Luny, stálic a kosmického počasí. Tohle je dnes ve hře.">
<meta name="theme-color" content="#111832">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nebeský kalendář">
<meta name="robots" content="noindex">
<script>(function(){try{var st=JSON.parse(localStorage.getItem('kairos_settings')||'{}'),t=st.theme||'auto';
if(t==='auto'||t==='dawn'||t==='dusk'){var h=new Date().getHours();t=h>=6&&h<20?'day':'night';}
document.documentElement.dataset.theme=t;
var c={day:'#0A4FA8',night:'#040A18'}[t];
var mt=document.querySelector('meta[name=theme-color]');if(mt)mt.setAttribute('content',c);}catch(e){}})();</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  /* NOC – podle nočního obrazu: půlnoční modř a zlato */
  --bg:#040A18; --bg2:#0A162B; --surface:#111F3A; --surface2:#18294A;
  --line:rgba(236,232,220,.15); --line2:rgba(236,232,220,.27);
  --text:#F2EBDB; --muted:#AFC1D9; --gold:#F0C874; --gold2:#A8873F; --gold-soft:rgba(240,200,116,.18);
  --on-gold:#161204; --h3:#C4D2E6;
  --harm-rgb:104,212,168; --tense-rgb:240,138,106; --sun-rgb:240,200,116;
  --harm:rgb(var(--harm-rgb)); --tense:rgb(var(--tense-rgb));
  --harm-soft:rgba(var(--harm-rgb),.18); --tense-soft:rgba(var(--tense-rgb),.18);
  --moon:#F6E6C2; --moon-dark:rgba(1,5,14,.5);
  --sun:#F0C874; --merc:#7FBBDC; --ven:#DC9EBC; --mar:#DE745C; --jup:#E2B068; --sat:#8D9FC0;
  --strip-bg:#02060F; --strip-line:rgba(2,6,15,.9); --wheel-bg:#0A162B;
  --glass:#152949; --field:#0D1B31; --glass-line:rgba(236,232,220,.24); --hairline:rgba(236,232,220,.17); --harm-ink:126,214,178; --tense-ink:244,152,122; --glass-shadow:rgba(0,3,12,.55);
  --sky:linear-gradient(180deg,#0A1B33 0%,#081527 50%,#050E1C 100%);--sky-tail:#050E1C;
  --halo:0 1px 3px rgba(0,4,14,.85), 0 0 10px rgba(0,4,14,.45);
  --halo-soft:0 1px 2px rgba(0,4,14,.7);
  --r:12px; --r-s:9px;
  --logo-filter:drop-shadow(0 2px 10px rgba(0,4,14,.7)); --logo-accent:#9FD0F0;
  --stars:.9; --tabs-bg:rgba(4,10,24,.94); --cell-a:1;
  --photo:url('sky-night.webp?v=2'); --photo-h:calc(100vw*3.6269);
  --tail-1:#061329; --tail-2:#0A1B33; --tail-3:#050E1C; --axis-a:.10; --geo-a:.07; --dust-a:.16;
  /* přístroj – mřížka jako logo: zlato na půlnoční modři, v obou režimech */
  --inst:linear-gradient(168deg,rgba(13,28,64,.85),rgba(5,12,34,.72));
  --inst-line:rgba(240,200,116,.34); --inst-line-soft:rgba(240,200,116,.16);
  --inst-text:#F2EAD8; --inst-muted:rgba(242,234,216,.55);
  --inst-gold:#EFC878; --harm-lite:#7FE0B4; --tense-lite:#FFA184;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif; --body:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
/* ---------- ROZEDNÍVÁNÍ – popelavá růž a broskev ---------- */
[data-theme="dawn"]{
  --bg:#EFDDD5; --bg2:#F7E7DA; --surface:#FFFAF3; --surface2:#F9EDE2;
  --line:rgba(63,44,49,.14); --line2:rgba(63,44,49,.25);
  --text:#39272E; --muted:#7C6567; --gold:#9E6A22; --gold2:#C9A251; --gold-soft:rgba(158,106,34,.12);
  --on-gold:#FFF8EC;
  --harm-rgb:26,116,90; --tense-rgb:180,70,44; --sun-rgb:206,132,54;
  --moon:#B4802F; --moon-dark:rgba(120,100,95,.18); --sun:#CE8436; --merc:#3B7791; --ven:#AC5C7C; --mar:#AF4E32; --jup:#B07826; --sat:#6E6C7E;
  --strip-bg:#EADCD3; --strip-line:rgba(255,252,247,.85); --wheel-bg:#F9EDE2;
  --sky:linear-gradient(180deg,#9A94A6 0%,#B7A3A6 24%,#C9AFA6 45%,#DEB49C 72%,#FBD8AE 100%);
  --glow:radial-gradient(ellipse at center,rgba(251,216,174,.5),transparent 66%);
  --stars:.14; --tabs-bg:rgba(247,231,218,.95); --cell-a:1.3; --h3:#7C6567;
  --glass:#FFFAF3; --field:#F7EDE5; --glass-line:rgba(255,255,255,.75); --hairline:rgba(63,44,49,.16); --harm-ink:20,100,76; --tense-ink:154,54,32; --glass-shadow:rgba(90,60,60,.14);
  --photo:url('sky-dawn.webp');
  --scrim:linear-gradient(180deg,rgba(239,221,213,.40) 0%,rgba(239,221,213,.66) 45%,rgba(239,221,213,.84) 100%);
}
/* ---------- DEN – modř průhledu a teplé krémové mraky ---------- */
[data-theme="day"]{
  --bg:#0A4FA8; --bg2:#1C68C4; --surface:#F8FBFF; --surface2:#E9F2FC;
  --line:rgba(233,241,252,.20); --line2:rgba(233,241,252,.34);
  --text:#EDF4FD; --muted:#B6CCE7; --gold:#F0C874; --gold2:#C7A257; --gold-soft:rgba(240,200,116,.16);
  --on-gold:#231A06; --h3:#EAF3FF;
  --harm-rgb:116,210,176; --tense-rgb:246,158,128; --sun-rgb:240,200,116;
  --moon:#F0DFAE; --moon-dark:rgba(255,255,255,.14);
  --sun:#BE801E; --merc:#20708F; --ven:#9E4F73; --mar:#AE3E26; --jup:#9C6E18; --sat:#546A88;
  --strip-bg:#DDEAF8; --strip-line:rgba(255,255,255,.9); --wheel-bg:#EDF4FD;
  --glass:#FAFCFF; --field:#EEF3F9; --glass-line:rgba(255,255,255,.92); --hairline:rgba(4,32,68,.16); --harm-ink:10,92,70; --tense-ink:150,48,26; --glass-shadow:rgba(3,32,72,.22);
  --sky:linear-gradient(180deg,#4590D1 0%,#2F7CC6 50%,#1B62B2 100%);--sky-tail:#1B62B2;
  --halo:0 1px 3px rgba(2,12,34,.8), 0 0 10px rgba(2,12,34,.45);
  --halo-soft:0 1px 2px rgba(2,12,34,.6);
  --logo-filter:drop-shadow(0 2px 10px rgba(1,20,50,.55));
  --logo-accent:#9FD0F0;
  --stars:0; --tabs-bg:rgba(233,242,252,.95); --cell-a:1.2;
  --photo:url('sky-day.webp?v=7'); --photo-h:calc(100vw*1.7769);
  --tail-1:#11365F; --tail-2:#2C517F; --tail-3:#48699A; --axis-a:.14; --geo-a:.09; --dust-a:.22;
}
/* ---------- STMÍVÁNÍ – rozžhavené mraky nad tmavnoucí modří ---------- */
[data-theme="dusk"]{
  --bg:#241E36; --bg2:#2F2745; --surface:#352C4C; --surface2:#403658;
  --line:rgba(246,238,228,.17); --line2:rgba(246,238,228,.28);
  --text:#F7F0E6; --muted:#BCB0C9; --gold:#F0C983; --gold2:#A48A55; --gold-soft:rgba(240,201,131,.18);
  --on-gold:#241705;
  --harm-rgb:126,214,176; --tense-rgb:246,150,120; --sun-rgb:246,176,110;
  --moon:#F8DCAC; --moon-dark:rgba(14,9,26,.42);
  --sun:#F6B06E; --merc:#92C4D8; --ven:#E3A6BC; --mar:#E4805F; --jup:#E7B571; --sat:#9E97AE;
  --strip-bg:#1C1730; --strip-line:rgba(28,23,48,.9); --wheel-bg:#2F2745;
  --glass:#3B3253; --field:#2C2440; --glass-line:rgba(246,238,228,.24); --hairline:rgba(246,238,228,.17); --harm-ink:128,214,176; --tense-ink:246,152,122; --glass-shadow:rgba(12,8,24,.42);
  --sky:linear-gradient(180deg,#332A4C 0%,#4A3A58 24%,#6E4C57 48%,#8A5A58 72%,#2C2440 100%);
  --glow:radial-gradient(ellipse at center,rgba(246,176,110,.22),transparent 62%);
  --stars:.42; --tabs-bg:rgba(36,30,54,.94); --cell-a:1.15; --h3:#BCB0C9;
  --photo:url('sky-dusk.webp');
  --scrim:linear-gradient(180deg,rgba(36,30,54,.56) 0%,rgba(36,30,54,.78) 42%,rgba(36,30,54,.91) 100%);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{position:relative;margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh;
  transition:background-color .4s ease,color .4s ease}
[data-bg="plain"] body{background-image:var(--sky);background-attachment:fixed}
#skybg{position:absolute;top:0;left:0;right:0;bottom:0;min-height:100vh;z-index:-2;pointer-events:none;
  background:
    radial-gradient(58% 20vh at 50% 100%, rgba(240,200,116,.10), transparent 72%),
    linear-gradient(90deg, transparent calc(50% - 1px), rgba(240,200,116,var(--axis-a)) 50%, transparent calc(50% + 1px)),
    radial-gradient(circle at 50% calc(var(--photo-h) + 62vw), transparent calc(56vw - 1px), rgba(240,200,116,var(--geo-a)) 56vw, transparent calc(56vw + 1.5px)),
    radial-gradient(circle at 50% calc(var(--photo-h) + 175vw), transparent calc(78vw - 1px), rgba(240,200,116,var(--geo-a)) 78vw, transparent calc(78vw + 1.5px)),
    radial-gradient(1.3px 1.3px at 23% 31%, rgba(255,252,240,var(--dust-a)) 50%, transparent 51%) 0 0/340px 340px repeat,
    radial-gradient(1px 1px at 71% 64%, rgba(240,220,170,var(--dust-a)) 50%, transparent 51%) 0 0/260px 260px repeat,
    linear-gradient(180deg, var(--tail-1) 0, var(--tail-1) calc(var(--photo-h) - 30vw), var(--tail-2) calc(var(--photo-h) + 120vw), var(--tail-3) 100%);
}
#skybg::before{content:'';position:absolute;top:0;left:0;right:0;height:var(--photo-h);
  background-image:var(--photo);background-size:100% auto;background-position:center top;background-repeat:no-repeat;
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 180px),transparent 100%);
  mask-image:linear-gradient(180deg,#000 calc(100% - 180px),transparent 100%);
}
[data-bg="plain"] #skybg{background:none}
[data-bg="plain"] #skybg::before{display:none}

a{color:var(--gold)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding:0 14px 96px}
/* hlavička */
.top{position:relative;display:flex;flex-direction:column;align-items:center;padding:20px 0 16px;border-bottom:1px solid var(--line)}
.top .profile-pill{position:absolute;top:10px;right:0}
.brand{margin:0;line-height:0;color:var(--gold);display:block;width:100%;font-size:0;text-align:center}
.brand .logo{display:block;margin:0 auto;width:min(400px,74%);height:auto;filter:var(--logo-filter)}
@media (max-width:640px){.top{padding:16px 0 13px}.brand .logo{width:80%}}
@media (max-width:420px){.top{padding:14px 0 11px}.brand .logo{width:84%}}
.profile-pill{font-size:12px;color:var(--muted);letter-spacing:.04em;padding:6px 10px;border:1px solid var(--line2);border-radius:999px;white-space:nowrap}
/* navigace */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;padding:8px max(10px,env(safe-area-inset-left)) max(10px,env(safe-area-inset-bottom));background:rgba(4,10,26,.92);border-top:1px solid rgba(240,200,116,.25);z-index:20}
.tab{flex:1;max-width:150px;padding:9px 4px 10px;border-radius:0;border-top:2px solid transparent;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,234,216,.72);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab .g{font-size:17px;line-height:1}
.tab.on{color:var(--inst-gold);border-top-color:var(--inst-gold);text-shadow:0 0 8px rgba(239,200,120,.35)}
.view{display:none;padding-top:20px}.view.on{display:block}
/* obecné */
.h2{font-family:var(--display);font-size:24px;font-weight:500;margin:22px 0 8px;color:var(--text);text-shadow:var(--halo)}
.h3{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--h3);margin:20px 0 9px;font-weight:500;text-shadow:var(--halo)}
.h3:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}

/* den: světlé texty na pozadí, tmavé uvnitř bílých karet a vstupů */
[data-theme="day"] .card,[data-theme="day"] .panel,[data-theme="day"] .list,
[data-theme="day"] input,[data-theme="day"] textarea,[data-theme="day"] select,[data-theme="day"] .wheel{
  --text:#04203F; --muted:#0E4372; --gold:#8A6410; --gold2:#C09B3E; --gold-soft:rgba(138,100,16,.13);
  --line:rgba(4,32,68,.16); --line2:rgba(4,32,68,.28);
  --harm-rgb:12,110,84; --tense-rgb:176,58,32; --harm-ink:10,92,70; --tense-ink:150,48,26; --sun-rgb:190,128,30;
  --moon:#9A6E12; --moon-dark:rgba(10,42,80,.16);
  --halo:none; --halo-soft:none;
  color:var(--text);
}
.card{background:var(--glass);border:1px solid var(--hairline);border-radius:var(--r);box-shadow:0 1px 3px var(--glass-shadow);padding:14px 14px 12px;margin:10px 0}
.muted{color:var(--muted)}.small{font-size:12.5px}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:9px 15px;border-radius:8px;border:1px solid var(--line2);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;background:transparent;color:var(--text)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:500}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.chip{padding:6px 11px;border-radius:8px;border:1px solid var(--hairline);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.chip.on{color:var(--gold);border-color:var(--gold)}
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;letter-spacing:.06em;border:1px solid var(--line2)}
.badge.harm{color:rgb(var(--harm-ink,var(--harm-rgb)));border-color:rgba(var(--harm-rgb),.5)}
.badge.tense{color:rgb(var(--tense-ink,var(--tense-rgb)));border-color:rgba(var(--tense-rgb),.5)}
.badge.neutral{color:var(--muted)}
.tone-harm{color:var(--harm)}.tone-tense{color:var(--tense)}.tone-gold{color:var(--gold)}
.list{list-style:none;margin:8px 0;padding:8px 14px;background:var(--glass);border:1px solid var(--hairline);border-radius:var(--r);box-shadow:0 1px 3px var(--glass-shadow)}
.list li{padding:7px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.list li:first-child{border-top:0}
.list .g{width:22px;flex:none;text-align:center;color:var(--gold);font-size:16px;line-height:1.3}
.list .t{flex:1}.list .t .n{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.list .w{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
.glyph{font-family:var(--display);font-size:18px}
/* kalendář */
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
.monthbar .mn{font-family:var(--display);font-size:27px;font-weight:500;letter-spacing:.05em;color:#F5EEDC;text-shadow:0 1px 5px rgba(2,10,28,.75)}
.monthbar .mn em{font-style:normal;color:rgba(240,224,180,.75);font-size:18px;margin-left:8px}
.navbtn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(240,200,116,.4);color:#F2EAD8;background:rgba(6,14,36,.45);font-size:18px;display:grid;place-items:center;transition:border-color .15s ease}
.navbtn:hover{border-color:var(--inst-gold)}
.monthbar .btn{color:#F2EAD8;border-color:rgba(240,200,116,.4);background:rgba(6,14,36,.45)}
.today-strip{display:flex;gap:14px;align-items:center;padding:10px 12px;border:1px solid var(--hairline);border-radius:10px;background:var(--glass);margin:6px 0 12px;font-size:13px;overflow-x:auto;white-space:nowrap}
.today-strip .k{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block}
.today-strip .v{font-family:var(--mono);font-size:13px}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(240,224,180,.85);text-align:center;margin-bottom:7px;padding-bottom:7px;border-bottom:1px solid rgba(240,200,116,.3);text-shadow:0 1px 4px rgba(2,10,28,.7)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{position:relative;aspect-ratio:1/.94;border-radius:10px;border:1px solid var(--inst-line-soft);
  background:var(--inst);color:var(--inst-text);
  --moon:#F0DFAE;--moon-dark:rgba(255,255,255,.13);
  padding:9px 9px 7px;text-align:left;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 16px rgba(2,8,24,.35);
  transition:border-color .15s ease,box-shadow .15s ease}
.cell:hover{border-color:var(--inst-line)}
.cell:after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.cell.harm:after{background:linear-gradient(180deg,#8FE8BE,#2F9E72)}
.cell.tense:after{background:linear-gradient(180deg,#FFB598,#C9563A)}
.cell.harm{border-color:rgba(127,224,180,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 22px rgba(60,190,140,calc(var(--a,.3) * .35)),0 4px 16px rgba(2,8,24,.35)}
.cell.tense{border-color:rgba(255,161,132,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 22px rgba(226,110,80,calc(var(--a,.3) * .35)),0 4px 16px rgba(2,8,24,.35)}
.cell.harm .d{color:var(--harm-lite)}
.cell.tense .d{color:var(--tense-lite)}
.cell.empty{background:none;border-color:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.cell.past{opacity:.38;filter:saturate(.55);box-shadow:none}
.cell.past.sel{opacity:.85;filter:none}
.cell.empty:hover{transform:none;box-shadow:none}
.cell.today{border-color:var(--inst-gold);box-shadow:inset 0 0 0 1px var(--inst-gold),inset 0 1px 0 rgba(255,255,255,.07),0 0 12px rgba(239,200,120,.25)}
.cell.sel{border-color:var(--inst-text);box-shadow:inset 0 0 0 1px var(--inst-text),0 4px 16px rgba(2,8,24,.35)}
.cell.today.sel{border-color:var(--inst-gold);box-shadow:inset 0 0 0 1px var(--inst-gold),0 0 0 3px rgba(239,200,120,.22),0 0 12px rgba(239,200,120,.25)}
.cell .d{font-family:var(--display);font-size:20px;font-weight:500;line-height:1;letter-spacing:.02em}
.cell.today .d{color:var(--inst-gold);text-shadow:0 0 7px rgba(239,200,120,.4)}
.cell .mk{position:absolute;right:7px;top:7px;font-size:13px;line-height:1;color:var(--inst-gold);display:flex;gap:3px;text-shadow:0 1px 3px rgba(0,4,14,.8)}
.cell .mk .kp{color:var(--tense-lite)}.cell .mk .ec{color:var(--inst-text)}
.cell .moon{position:absolute;right:7px;bottom:7px;width:11px;height:11px;opacity:.8}
@media (max-width:420px){.cell{padding:7px 6px 5px;border-radius:8px}.cell .d{font-size:17px}.cell .moon{width:10px;height:10px;right:5px;bottom:6px}.cell .mk{right:5px;top:6px;font-size:12px}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:rgba(238,242,250,.85);margin:10px 2px 0;text-shadow:0 1px 4px rgba(2,10,28,.7)}
.legend i{display:inline-block;width:14px;height:2px;border-radius:0;margin-right:6px;vertical-align:3px}
.legend-more{margin:8px 2px 0;font-size:12.5px;color:var(--muted)}
.legend-more summary{cursor:pointer;color:var(--gold);letter-spacing:.04em;text-shadow:var(--halo-soft)}
.legend-more[open] summary{margin-bottom:6px}

.star .nm em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}
.star .why{font-size:12.5px;color:var(--muted);margin-top:2px}
.star .why span{display:block}
.star.main .nm{color:var(--gold)}
/* nastavení */
.natal-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.natal-sum .ns{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px 10px;
  border:1px solid var(--inst-line-soft);border-radius:var(--r);background:var(--inst);color:var(--inst-text);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 14px rgba(2,8,24,.3)}
.natal-sum .g{font-family:var(--display);font-size:22px;color:var(--inst-gold);line-height:1.1}
.natal-sum .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--inst-muted)}
.natal-sum .v{font-family:var(--display);font-size:17px;font-weight:500}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.form{grid-template-columns:1fr}.form label.wide{grid-column:auto}}
.form label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.form label.wide{grid-column:1/-1}
.form input,.form select,.form textarea{font:inherit;font-size:15px;letter-spacing:0;text-transform:none;color:var(--text);background:var(--field);border:1px solid var(--line2);border-radius:9px;padding:9px 10px;min-width:0}
.form textarea{min-height:90px;font-family:var(--mono);font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin:6px 0;text-shadow:var(--halo-soft)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);width:max-content;max-width:86vw;background:#0E1830;border:1px solid rgba(240,216,152,.55);color:#F2EAD8;padding:10px 16px;border-radius:12px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;box-shadow:0 8px 24px rgba(2,8,24,.55);text-align:center}
.toast.on{opacity:1}
.loading{padding:30px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script src="astronomy.browser.min.js"></script>
<script>
/* ============================================================
   KAIROS – výpočetní jádro (astronomie + astrologická pravidla)
   Čistě funkční modul nad knihovnou astronomy-engine (MIT).
   Stejný soubor běží v Node (testy) i v prohlížeči (inline).
   ============================================================ */
function createKairosEngine(A) {
  'use strict';

  const DEG = Math.PI / 180;
  const RAD = 180 / Math.PI;
  const norm = (x) => ((x % 360) + 360) % 360;
  const diff = (a, b) => { let d = norm(a - b); return d > 180 ? d - 360 : d; }; // signed a-b in (-180,180]

  // ---------- názvosloví ----------
  const SIGNS = ['Beran', 'Býk', 'Blíženci', 'Rak', 'Lev', 'Panna', 'Váhy', 'Štír', 'Střelec', 'Kozoroh', 'Vodnář', 'Ryby'];
  const SIGN_GLYPH = ['♈', '♉', '♊', '♋', '♌', '♍', '♎', '♏', '♐', '♑', '♒', '♓'];
  const SIGN_LOC = ['Beranu', 'Býku', 'Blížencích', 'Raku', 'Lvu', 'Panně', 'Vahách', 'Štíru', 'Střelci', 'Kozorohu', 'Vodnáři', 'Rybách'];
  const SIGN_LOC_V = SIGN_LOC.map((s, i) => ([4, 6, 7, 8, 10].includes(i) ? 've ' : 'v ') + s);
  const SIGN_GEN = ['Berana', 'Býka', 'Blíženců', 'Raka', 'Lva', 'Panny', 'Vah', 'Štíra', 'Střelce', 'Kozoroha', 'Vodnáře', 'Ryb'];
  const ELEMENT = ['oheň', 'země', 'vzduch', 'voda', 'oheň', 'země', 'vzduch', 'voda', 'oheň', 'země', 'vzduch', 'voda'];
  const FRIENDLY = { 'oheň': ['oheň', 'vzduch'], 'vzduch': ['vzduch', 'oheň'], 'země': ['země', 'voda'], 'voda': ['voda', 'země'] };

  const BODIES = ['Sun', 'Moon', 'Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune', 'Pluto'];
  const PLANETS_NO_MOON = BODIES.filter(b => b !== 'Moon');
  const BODY_CZ = { Sun: 'Slunce', Moon: 'Luna', Mercury: 'Merkur', Venus: 'Venuše', Mars: 'Mars', Jupiter: 'Jupiter', Saturn: 'Saturn', Uranus: 'Uran', Neptune: 'Neptun', Pluto: 'Pluto', Node: 'Uzel', Asc: 'Ascendent', MC: 'MC' };
  const BODY_GLYPH = { Sun: '☉', Moon: '☽', Mercury: '☿', Venus: '♀', Mars: '♂', Jupiter: '♃', Saturn: '♄', Uranus: '♅', Neptune: '♆', Pluto: '♇', Node: '☊', Asc: 'Asc', MC: 'MC' };
  // 2. pád / 4. pád pro texty typu "trigon tvého Slunce"
  const BODY_GEN = { Sun: 'Slunce', Moon: 'Luny', Mercury: 'Merkuru', Venus: 'Venuše', Mars: 'Marsu', Jupiter: 'Jupiteru', Saturn: 'Saturnu', Uranus: 'Uranu', Neptune: 'Neptunu', Pluto: 'Pluta', Asc: 'Ascendentu', MC: 'MC', Node: 'Uzlu' };

  const ASPECTS = [
    { key: 'conj', angle: 0, glyph: '☌', cz: 'konjunkce', kind: 'neutral' },
    { key: 'sextile', angle: 60, glyph: '⚹', cz: 'sextil', kind: 'harm' },
    { key: 'square', angle: 90, glyph: '□', cz: 'kvadratura', kind: 'tense' },
    { key: 'trine', angle: 120, glyph: '△', cz: 'trigon', kind: 'harm' },
    { key: 'opposition', angle: 180, glyph: '☍', cz: 'opozice', kind: 'tense' },
  ];

  // ---------- stálice: hvězdy systémů z Hvězdného kvízu + královské hvězdy ----------
  // RA/Dec J2000 (stupně), vzdálenost ve světelných letech, av = arcus visionis (°) pro heliakický východ
  const STARS = [
    { id: 'alcyone', name: 'Plejády (Alcyone)', system: 'Plejády', ra: 56.8711, dec: 24.1051, ly: 440, mag: 2.9, av: 11 },
    { id: 'hyades', name: 'Hyády (střed kupy)', system: 'Hyády', ra: 66.75, dec: 15.87, ly: 153, mag: 3.5, av: 12 },
    { id: 'aldebaran', name: 'Aldebaran', system: 'Aldebaran', ra: 68.9802, dec: 16.5093, ly: 65, mag: 0.9, av: 9, royal: true },
    { id: 'rigel', name: 'Rigel', system: 'Orion', ra: 78.6345, dec: -8.2016, ly: 860, mag: 0.1, av: 9 },
    { id: 'bellatrix', name: 'Bellatrix', system: 'Orion', ra: 81.2828, dec: 6.3497, ly: 250, mag: 1.6, av: 10 },
    { id: 'mintaka', name: 'Mintaka', system: 'Orion', ra: 83.0017, dec: -0.2991, ly: 1200, mag: 2.2, av: 11 },
    { id: 'betelgeuse', name: 'Betelgeuse', system: 'Betelgeuse', ra: 88.7929, dec: 7.4071, ly: 550, mag: 0.5, av: 9 },
    { id: 'sirius', name: 'Sirius', system: 'Sirius', ra: 101.2872, dec: -16.7161, ly: 8.6, mag: -1.5, av: 8 },
    { id: 'procyon', name: 'Procyon', system: 'Procyon', ra: 114.8255, dec: 5.2250, ly: 11.5, mag: 0.4, av: 9 },
    { id: 'regulus', name: 'Regulus', system: 'Královská hvězda', ra: 152.0930, dec: 11.9672, ly: 79, mag: 1.4, av: 10, royal: true },
    { id: 'arcturus', name: 'Arcturus', system: 'Arcturus', ra: 213.9153, dec: 19.1824, ly: 37, mag: -0.05, av: 8 },
    { id: 'hadar', name: 'Hadar', system: 'Hadar', ra: 210.9558, dec: -60.3730, ly: 390, mag: 0.6, av: 9 },
    { id: 'alphacen', name: 'Alfa Centauri', system: 'Alfa Centauri', ra: 219.9021, dec: -60.8340, ly: 4.4, mag: -0.3, av: 8 },
    { id: 'antares', name: 'Antares', system: 'Antares', ra: 247.3519, dec: -26.4320, ly: 550, mag: 1.0, av: 9, royal: true },
    { id: 'vega', name: 'Vega', system: 'Lyra', ra: 279.2347, dec: 38.7837, ly: 25, mag: 0.0, av: 8 },
    { id: 'sheliak', name: 'Sheliak', system: 'Sheliak', ra: 282.5200, dec: 33.3627, ly: 960, mag: 3.5, av: 12 },
    { id: 'fomalhaut', name: 'Fomalhaut', system: 'Fomalhaut', ra: 344.4127, dec: -29.6222, ly: 25, mag: 1.2, av: 10, royal: true },
    { id: 'andromeda', name: 'Andromeda (galaxie M31)', system: 'Andromeda', ra: 10.6847, dec: 41.2692, ly: 2500000, mag: 3.4, av: 14 },
    { id: 'schedar', name: 'Schedar (Kassiopea)', system: 'Kassiopea', ra: 10.1268, dec: 56.5373, ly: 228, mag: 2.2, av: 11 },
    { id: 'polaris', name: 'Polárka', system: 'Polárka', ra: 37.9545, dec: 89.2641, ly: 430, mag: 2.0, av: 11 },
    { id: 'tauceti', name: 'Tau Ceti', system: 'Tau Ceti', ra: 26.0170, dec: -15.9375, ly: 11.9, mag: 3.5, av: 12 },
    { id: 'zetaret', name: 'Zeta Reticuli', system: 'Zeta Reticuli', ra: 49.5534, dec: -62.5064, ly: 39, mag: 5.2, av: 14 },
  ];

  const METEOR_SHOWERS = [
    { name: 'Kvadrantidy', month: 1, day: 3, zhr: 120 },
    { name: 'Lyridy', month: 4, day: 22, zhr: 18 },
    { name: 'Eta Aquaridy', month: 5, day: 6, zhr: 50 },
    { name: 'Delta Aquaridy', month: 7, day: 30, zhr: 25 },
    { name: 'Perseidy', month: 8, day: 12, zhr: 100 },
    { name: 'Drakonidy', month: 10, day: 8, zhr: 10 },
    { name: 'Orionidy', month: 10, day: 21, zhr: 20 },
    { name: 'Tauridy', month: 11, day: 5, zhr: 5 },
    { name: 'Leonidy', month: 11, day: 17, zhr: 15 },
    { name: 'Geminidy', month: 12, day: 14, zhr: 150 },
    { name: 'Ursidy', month: 12, day: 22, zhr: 10 },
  ];

  const CHALDEAN = ['Saturn', 'Jupiter', 'Mars', 'Sun', 'Venus', 'Mercury', 'Moon'];
  const DAY_RULER = ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn']; // index = getDay (0 = neděle)
  const WEEKDAY_CZ = ['neděle', 'pondělí', 'úterý', 'středa', 'čtvrtek', 'pátek', 'sobota'];
  const MONTH_CZ = ['leden', 'únor', 'březen', 'duben', 'květen', 'červen', 'červenec', 'srpen', 'září', 'říjen', 'listopad', 'prosinec'];
  const MONTH_GEN = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];

  // ---------- čas a časová zóna ----------
  const TZ = 'Europe/Prague';
  const _fmtCache = {};
  function tzParts(date, tz) {
    tz = tz || TZ;
    let f = _fmtCache[tz];
    if (!f) {
      f = _fmtCache[tz] = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short' });
    }
    const p = {};
    for (const x of f.formatToParts(date)) p[x.type] = x.value;
    const wd = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[p.weekday];
    return { y: +p.year, m: +p.month, d: +p.day, hh: p.hour === '24' ? 0 : +p.hour, mm: +p.minute, ss: +p.second, wd };
  }
  function tzOffsetMin(date, tz) {
    const p = tzParts(date, tz);
    const asUTC = Date.UTC(p.y, p.m - 1, p.d, p.hh, p.mm, p.ss);
    return Math.round((asUTC - date.getTime()) / 60000);
  }
  // místní čas -> Date (UTC instant)
  function localToDate(y, m, d, hh, mm, tz) {
    hh = hh || 0; mm = mm || 0;
    let guess = Date.UTC(y, m - 1, d, hh, mm, 0);
    let off = tzOffsetMin(new Date(guess), tz);
    let utc = guess - off * 60000;
    const off2 = tzOffsetMin(new Date(utc), tz);
    if (off2 !== off) utc = guess - off2 * 60000;
    return new Date(utc);
  }
  const dayStart = (y, m, d, tz) => localToDate(y, m, d, 0, 0, tz);
  const addDays = (date, n) => new Date(date.getTime() + n * 86400000);
  const T = (date) => A.MakeTime(date);
  const isoDate = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  function dateKey(date, tz) { const p = tzParts(date, tz); return isoDate(p.y, p.m, p.d); }
  function fmtTime(date, tz) { const p = tzParts(date, tz); return `${p.hh}:${String(p.mm).padStart(2, '0')}`; }
  function fmtDateCz(date, tz) { const p = tzParts(date, tz); return `${p.d}. ${p.m}. ${p.y}`; }
  function fmtDateLong(date, tz) { const p = tzParts(date, tz); return `${WEEKDAY_CZ[p.wd]} ${p.d}. ${MONTH_GEN[p.m - 1]} ${p.y}`; }
  function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }

  // ---------- polohy ----------
  function lonOf(body, time) {
    if (body === 'Sun') return A.SunPosition(time).elon;
    if (body === 'Moon') return A.EclipticGeoMoon(time).lon;
    return A.Ecliptic(A.GeoVector(body, time, true)).elon;
  }
  function meanNode(time) {
    const Tc = (time.tt) / 36525.0; // TT dny od J2000
    let om = 125.0445479 - 1934.1362891 * Tc + 0.0020754 * Tc * Tc + Tc * Tc * Tc / 467441 - Tc * Tc * Tc * Tc / 60616000;
    return norm(om);
  }
  // polohy všech těles v daný okamžik + rychlost (°/den) + retrogradita
  function positions(date) {
    const t = T(date), t1 = T(new Date(date.getTime() + 86400000));
    const out = {};
    for (const b of BODIES) {
      const l0 = lonOf(b, t), l1 = lonOf(b, t1);
      const sp = diff(l1, l0);
      out[b] = { lon: l0, speed: sp, retro: sp < 0 && b !== 'Sun' && b !== 'Moon' };
    }
    out.Node = { lon: meanNode(t), speed: -0.053, retro: true };
    return out;
  }
  const signOf = (lon) => Math.floor(norm(lon) / 30);
  const degInSign = (lon) => norm(lon) - signOf(lon) * 30;
  function fmtLon(lon, withSign = true) {
    const s = signOf(lon), d = degInSign(lon);
    const dd = Math.floor(d), mm = Math.floor((d - dd) * 60);
    return `${dd}°${String(mm).padStart(2, '0')}′` + (withSign ? ` ${SIGN_GLYPH[s]}` : '');
  }
  function fmtLonText(lon) { const s = signOf(lon), d = degInSign(lon); return `${Math.floor(d)}°${String(Math.floor((d - Math.floor(d)) * 60)).padStart(2, '0')}′ ${SIGNS[s]}`; }

  // ---------- stálice ----------
  function starLonLat(star, time) {
    const v = A.VectorFromSphere(new A.Spherical(star.dec, star.ra, 1), time);
    const ect = A.RotateVector(A.Rotation_EQJ_ECT(time), v);
    const s = A.SphereFromVector(ect);
    return { lon: norm(s.lon), lat: s.lat };
  }
  const SLOT = 'Star1';
  function defineStar(star) { A.DefineStar(SLOT, star.ra / 15, star.dec, star.ly); return SLOT; }

  // ---------- Asc, MC, domy (Placidus) ----------
  function ascMC(time, lat, lon) {
    const gst = A.SiderealTime(time); // hodiny
    const ramc = norm((gst + lon / 15) * 15);
    const eps = A.e_tilt(time).tobl;
    const r = ramc * DEG, e = eps * DEG, f = lat * DEG;
    const mc = norm(Math.atan2(Math.sin(r), Math.cos(r) * Math.cos(e)) * RAD);
    const asc = norm(Math.atan2(Math.cos(r), -(Math.sin(r) * Math.cos(e) + Math.tan(f) * Math.sin(e))) * RAD);
    return { ramc, eps, mc, asc, lst: norm(ramc) / 15 };
  }
  function placidus(ramc, lat, eps) {
    const f = lat * DEG, e = eps * DEG;
    const raToLon = (ra) => norm(Math.atan2(Math.sin(ra * DEG), Math.cos(ra * DEG) * Math.cos(e)) * RAD);
    const semiArc = (ra) => { // denní půloblouk bodu ekliptiky s danou RA
      const tanDec = Math.tan(e) * Math.sin(ra * DEG);
      let c = -Math.tan(f) * tanDec;
      c = Math.max(-1, Math.min(1, c));
      return Math.acos(c) * RAD;
    };
    const solve = (start, fn) => { let ra = start; for (let i = 0; i < 40; i++) ra = fn(ra); return ra; };
    const ra11 = solve(ramc + 30, ra => ramc + semiArc(ra) / 3);
    const ra12 = solve(ramc + 60, ra => ramc + 2 * semiArc(ra) / 3);
    const ra2 = solve(ramc + 120, ra => ramc + 60 + 2 * semiArc(ra) / 3);
    const ra3 = solve(ramc + 150, ra => ramc + 120 + semiArc(ra) / 3);
    const c = new Array(13);
    c[10] = raToLon(ramc); c[11] = raToLon(ra11); c[12] = raToLon(ra12);
    c[2] = raToLon(ra2); c[3] = raToLon(ra3);
    c[4] = norm(c[10] + 180); c[5] = norm(c[11] + 180); c[6] = norm(c[12] + 180);
    c[8] = norm(c[2] + 180); c[9] = norm(c[3] + 180);
    return c; // c[1] a c[7] doplní volající (Asc/Desc)
  }
  function houseOf(lon, cusps) {
    for (let h = 1; h <= 12; h++) {
      const a = cusps[h], b = cusps[h === 12 ? 1 : h + 1];
      const span = norm(b - a), x = norm(lon - a);
      if (x < span) return h;
    }
    return 12;
  }

  // ---------- aspekty ----------
  function aspectBetween(lonA, lonB, orbs) {
    const d = Math.abs(diff(lonA, lonB));
    let best = null;
    for (const asp of ASPECTS) {
      const orb = Math.abs(d - asp.angle);
      const maxOrb = orbs[asp.key] != null ? orbs[asp.key] : orbs.default;
      if (orb <= maxOrb && (!best || orb < best.orb)) best = { ...asp, orb, sep: d };
    }
    return best;
  }

  // ---------- nativ ----------
  function natalChart(profile, nowDate) {
    const date = localToDate(profile.y, profile.m, profile.d, profile.hh, profile.mm, profile.tz || TZ);
    const time = T(date);
    const nowTime = T(nowDate || new Date());
    const observer = new A.Observer(profile.lat, profile.lon, profile.alt || 200);
    const pos = positions(date);
    const ang = ascMC(time, profile.lat, profile.lon);
    const cusps = placidus(ang.ramc, profile.lat, ang.eps);
    cusps[1] = ang.asc; cusps[7] = norm(ang.asc + 180);
    const points = {};
    for (const b of BODIES) points[b] = { lon: pos[b].lon, retro: pos[b].retro, speed: pos[b].speed, house: houseOf(pos[b].lon, cusps) };
    points.Node = { lon: pos.Node.lon, retro: true, house: houseOf(pos.Node.lon, cusps) };
    points.Asc = { lon: ang.asc, house: 1 };
    points.MC = { lon: ang.mc, house: 10 };
    // stálice v nativu
    const stars = STARS.map(st => {
      const ll = starLonLat(st, time);
      const conj = [];
      for (const k of ['Sun', 'Moon', 'Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune', 'Pluto', 'Asc', 'MC']) {
        const o = Math.abs(diff(ll.lon, points[k].lon));
        if (o <= 1.0) conj.push({ point: k, orb: o });
      }
      return { ...st, lon: ll.lon, lat: ll.lat, lonNow: starLonLat(st, nowTime).lon, house: houseOf(ll.lon, cusps), conj, angles: [], parans: [] };
    });
    // hvězdy na úhlech v okamžiku narození + parany dne narození
    const latR = profile.lat * DEG;
    const hourAngleInfo = (body, t) => {
      const eq = A.Equator(body, t, observer, true, true);
      const ha = norm((A.SiderealTime(t) + profile.lon / 15 - eq.ra) * 15); // 0..360, stupně
      let c = -Math.tan(latR) * Math.tan(eq.dec * DEG);
      const riseHA = (c >= -1 && c <= 1) ? Math.acos(c) * RAD : null; // null = cirkumpolární / nikdy nevychází
      return { ha, riseHA, dec: eq.dec };
    };
    const angleHits = (info, orb) => {
      const hits = [];
      const d0 = Math.abs(diff(info.ha, 0)); if (d0 <= orb) hits.push({ angle: 'kulminuje', orb: d0 });
      const d180 = Math.abs(diff(info.ha, 180)); if (d180 <= orb) hits.push({ angle: 'antikulminuje', orb: d180 });
      if (info.riseHA != null) {
        const dr = Math.abs(diff(info.ha, -info.riseHA)); if (dr <= orb) hits.push({ angle: 'vychází', orb: dr });
        const ds = Math.abs(diff(info.ha, info.riseHA)); if (ds <= orb) hits.push({ angle: 'zapadá', orb: ds });
      }
      return hits;
    };
    const ORB_ANGLE = 1.0, ORB_PARAN = 1.0;
    const dStart = dayStart(profile.y, profile.m, profile.d, profile.tz || TZ);
    const tStart = T(dStart);
    for (const st of stars) {
      const body = defineStar(st);
      const info = hourAngleInfo(body, time);
      st.neverRises = info.riseHA == null && info.dec < 0;
      st.circumpolar = info.riseHA == null && info.dec > 0;
      st.angles = angleHits(info, ORB_ANGLE);
      // parany: 4 úhly hvězdy během dne narození
      const events = [];
      const up = A.SearchHourAngle(body, observer, 0, tStart, +1); if (up && up.time.date < addDays(dStart, 1)) events.push({ angle: 'kulminuje', time: up.time });
      const low = A.SearchHourAngle(body, observer, 12, tStart, +1); if (low && low.time.date < addDays(dStart, 1)) events.push({ angle: 'antikulminuje', time: low.time });
      if (info.riseHA != null) {
        const r = A.SearchAltitude(body, observer, +1, tStart, 1, 0); if (r) events.push({ angle: 'vychází', time: r });
        const s = A.SearchAltitude(body, observer, -1, tStart, 1, 0); if (s) events.push({ angle: 'zapadá', time: s });
      }
      for (const ev of events) {
        for (const pb of BODIES) {
          const pinfo = hourAngleInfo(pb, ev.time);
          for (const h of angleHits(pinfo, ORB_PARAN)) st.parans.push({ starAngle: ev.angle, planet: pb, planetAngle: h.angle, orb: h.orb, time: ev.time.date });
        }
      }
    }
    const LIGHTS = ['Sun', 'Moon'];
    for (const st of stars) {
      st.strength = 0;
      if (st.conj.length) st.strength += 3;
      if (st.angles.length) st.strength += 3;
      for (const p of st.parans) st.strength += LIGHTS.includes(p.planet) ? 2 : 1;
      st.mine = st.conj.length > 0 || st.angles.length > 0 || st.parans.some(p => LIGHTS.includes(p.planet));
    }
    return { profile, date, points, cusps, ang, stars, sunSign: signOf(pos.Sun.lon), moonSign: signOf(pos.Moon.lon) };
  }

  // ---------- kořeny / hledání okamžiků ----------
  function bisect(fn, t0, t1, iters = 30) {
    let a = t0, b = t1, fa = fn(a);
    for (let i = 0; i < iters; i++) {
      const m = (a + b) / 2, fm = fn(m);
      if ((fa < 0) === (fm < 0)) { a = m; fa = fm; } else b = m;
      if (b - a < 1000) break;
    }
    return (a + b) / 2;
  }

  // hodinová mřížka poloh pro interval [t0,t1] (ms) – sdílená pro VoC, aspekty Luny, ingresy
  function hourGrid(t0ms, t1ms, bodies, stepH = 1) {
    const rows = [];
    const step = stepH * 3600000;
    for (let ms = t0ms; ms <= t1ms + 1; ms += step) {
      const t = T(new Date(ms));
      const r = { ms };
      for (const b of bodies) r[b] = lonOf(b, t);
      rows.push(r);
    }
    return rows;
  }

  // přesné aspekty Luny k cílům (konstanty nebo funkce času) v intervalu
  // targets: [{key, lon:number | fn(ms)->lon, aspects?:[keys]}]
  function moonAspectEvents(grid, targets, aspectKeys) {
    const out = [];
    const aspects = ASPECTS.filter(a => !aspectKeys || aspectKeys.includes(a.key));
    for (const tg of targets) {
      const tl = (ms, row) => typeof tg.lon === 'function' ? tg.lon(ms, row) : tg.lon;
      for (const asp of aspects) {
        const angles = asp.angle === 0 || asp.angle === 180 ? [asp.angle] : [asp.angle, -asp.angle];
        for (const ang of angles) {
          const f = (ms, row) => diff(row ? row.Moon : lonOf('Moon', T(new Date(ms))), tl(ms, row) + ang);
          for (let i = 1; i < grid.length; i++) {
            const fa = f(grid[i - 1].ms, grid[i - 1]), fb = f(grid[i].ms, grid[i]);
            if (Math.abs(fa) < 90 && Math.abs(fb) < 90 && (fa < 0) !== (fb < 0) && fa <= 0) {
              // Luna se pohybuje dopředu: crossing z negativního na pozitivní
              const ms = bisect((x) => f(x, null), grid[i - 1].ms, grid[i].ms);
              out.push({ ms, target: tg.key, aspect: asp.key, glyph: asp.glyph, cz: asp.cz, kind: asp.kind });
            }
          }
        }
      }
    }
    out.sort((a, b) => a.ms - b.ms);
    return out;
  }

  // ingresy (změna znamení) těles v mřížce
  function ingressEvents(grid, bodies) {
    const out = [];
    for (const b of bodies) {
      for (let i = 1; i < grid.length; i++) {
        const s0 = signOf(grid[i - 1][b]), s1 = signOf(grid[i][b]);
        if (s0 !== s1) {
          const target = s1 === (s0 + 1) % 12 ? s1 * 30 : s0 * 30; // dopředu nebo (retro) zpět
          const ms = bisect((x) => diff(lonOf(b, T(new Date(x))), target), grid[i - 1].ms, grid[i].ms);
          out.push({ ms, body: b, from: s0, to: s1, retro: s1 !== (s0 + 1) % 12 });
        }
      }
    }
    out.sort((a, b) => a.ms - b.ms);
    return out;
  }

  // měsíční kontext: mřížka, ingresy Luny, aspekty Luny k planetám, VoC
  const _ctxCache = {};
  function monthContext(y, m, tz) {
    const key = `${y}-${m}`;
    if (_ctxCache[key]) return _ctxCache[key];
    const t0 = dayStart(y, m, 1, tz).getTime() - 3 * 86400000;
    const t1 = dayStart(y, m, daysInMonth(y, m), tz).getTime() + 4 * 86400000;
    const grid = hourGrid(t0, t1, BODIES);
    const moonIngress = ingressEvents(grid, ['Moon']);
    const planetTargets = PLANETS_NO_MOON.map(b => ({ key: b, lon: (ms, row) => row ? row[b] : lonOf(b, T(new Date(ms))) }));
    const moonAspects = moonAspectEvents(grid, planetTargets);
    // VoC: od posledního aspektu v každém úseku znamení po ingres
    const voc = [];
    for (const ing of moonIngress) {
      const last = moonAspects.filter(a => a.ms < ing.ms).pop();
      const prevIng = moonIngress.filter(x => x.ms < ing.ms).pop();
      const from = last && (!prevIng || last.ms > prevIng.ms) ? last.ms : (prevIng ? prevIng.ms : null);
      if (from != null) voc.push({ from, to: ing.ms, lastAspect: last && (!prevIng || last.ms > prevIng.ms) ? last : null, toSign: ing.to });
    }
    const ctx = { y, m, grid, moonIngress, moonAspects, voc, t0, t1 };
    _ctxCache[key] = ctx;
    return ctx;
  }

  // ---------- Luna: fáze, lunární den ----------
  function moonQuartersBetween(d0, d1) {
    const out = [];
    let mq = A.SearchMoonQuarter(T(d0));
    while (mq && mq.time.date < d1) {
      out.push({ quarter: mq.quarter, date: mq.time.date });
      mq = A.NextMoonQuarter(mq);
    }
    return out;
  }
  function lastNewMoonBefore(date) {
    let t = A.SearchMoonPhase(0, T(addDays(date, -31)), 33);
    let found = t;
    while (t && t.date <= date) { found = t; t = A.SearchMoonPhase(0, T(addDays(t.date, 1)), 33); }
    return found ? found.date : null;
  }
  function lunarDay(date, observer) {
    const nm = lastNewMoonBefore(date);
    if (!nm) return null;
    let count = 1, t = T(nm), rises = [];
    for (let i = 0; i < 32; i++) {
      const r = A.SearchRiseSet('Moon', observer, +1, t, 2);
      if (!r || r.date > date) break;
      count++; rises.push(r.date); t = T(new Date(r.date.getTime() + 60000));
    }
    return { day: count, since: rises.length ? rises[rises.length - 1] : nm, newMoon: nm };
  }

  // ---------- planetární hodiny ----------
  function planetaryHours(y, m, d, observer, tz) {
    const ds = dayStart(y, m, d, tz);
    const sr = A.SearchRiseSet('Sun', observer, +1, T(ds), 1);
    const ss = A.SearchRiseSet('Sun', observer, -1, T(ds), 1);
    if (!sr || !ss) return null;
    const nextSr = A.SearchRiseSet('Sun', observer, +1, T(new Date(sr.date.getTime() + 60000)), 2);
    const sunrise = sr.date, sunset = ss.date, nextSunrise = nextSr.date;
    const wd = tzParts(sunrise, tz).wd;
    const ruler = DAY_RULER[wd];
    let idx = CHALDEAN.indexOf(ruler);
    const hours = [];
    const dayLen = (sunset - sunrise) / 12, nightLen = (nextSunrise - sunset) / 12;
    for (let i = 0; i < 24; i++) {
      const start = i < 12 ? new Date(sunrise.getTime() + i * dayLen) : new Date(sunset.getTime() + (i - 12) * nightLen);
      const end = i < 12 ? new Date(sunrise.getTime() + (i + 1) * dayLen) : new Date(sunset.getTime() + (i - 11) * nightLen);
      hours.push({ n: i + 1, ruler: CHALDEAN[(idx + i) % 7], start, end, night: i >= 12 });
    }
    return { sunrise, sunset, nextSunrise, ruler, hours };
  }

  // ---------- skóre dne ----------
  const DEFAULT_RULES = {
    orbs: { default: 3, sextile: 2 },
    pointWeight: { Sun: 2, Moon: 2, Asc: 2, MC: 2, default: 1 },
    aspectWeight: { trine: 1, sextile: 0.5, square: -1, opposition: -1 },
    conjWeight: { Sun: 1, Moon: 0.5, Mercury: 0, Venus: 1, Mars: -1, Jupiter: 1, Saturn: -1, Uranus: -0.5, Neptune: -0.5, Pluto: -1 },
    moonAspect: 0.25, moonCap: 1,
    moonElement: 0.5,
    vocPenalty: -1, vocHours: 6,
    mercuryRetro: -0.5,
    kp: { calm: 0.5, g1: -1, g2: -2 },
    thresholds: { harm: 2, tense: -2 },
    starOrb: 1, starOrbPhase: 2,
  };

  function dayAnalysis(y, m, d, natal, observer, tz, kpForDay, rules) {
    rules = rules || DEFAULT_RULES;
    const ds = dayStart(y, m, d, tz);
    const dayEnd = (() => { const p = tzParts(addDays(ds, 1.5), tz); return dayStart(p.y, p.m, p.d, tz); })();
    const noon = new Date(ds.getTime() + (dayEnd.getTime() - ds.getTime()) / 2);
    const pos = positions(noon);
    const reasons = [];
    let score = 0, backgroundScore = 0;
    const SLOW = ['Jupiter', 'Saturn', 'Uranus', 'Neptune', 'Pluto'];
    const W = (k) => rules.pointWeight[k] != null ? rules.pointWeight[k] : rules.pointWeight.default;
    const NATAL_KEYS = ['Sun', 'Moon', 'Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune', 'Pluto', 'Asc', 'MC'];

    // tranzity (bez Luny) v poledne
    const transits = [];
    for (const tb of PLANETS_NO_MOON) {
      for (const nk of NATAL_KEYS) {
        const asp = aspectBetween(pos[tb].lon, natal.points[nk].lon, rules.orbs);
        if (!asp) continue;
        const pos2 = lonOf(tb, T(new Date(noon.getTime() + 86400000)));
        const orbNext = Math.abs(Math.abs(diff(pos2, natal.points[nk].lon)) - asp.angle);
        const applying = orbNext < asp.orb;
        let w = asp.key === 'conj' ? rules.conjWeight[tb] : rules.aspectWeight[asp.key];
        w = w * W(nk) * (asp.orb <= 1.5 ? 1 : 0.5);
        const slow = SLOW.includes(tb);
        transits.push({ transit: tb, natal: nk, ...asp, applying, weight: w, retro: pos[tb].retro, slow });
        if (slow) backgroundScore += w; else score += w;
      }
    }
    transits.sort((a, b) => a.orb - b.orb);
    const background = transits.filter(t => t.slow), fast = transits.filter(t => !t.slow);

    // Luna: přesné aspekty k nativu během dne
    const ctx = monthContext(y, m, tz);
    const grid = ctx.grid.filter(r => r.ms >= ds.getTime() - 3600000 && r.ms <= dayEnd.getTime() + 3600000);
    const natalTargets = NATAL_KEYS.map(k => ({ key: k, lon: natal.points[k].lon }));
    const moonToNatal = moonAspectEvents(grid, natalTargets).filter(e => e.ms >= ds.getTime() && e.ms < dayEnd.getTime());
    let moonScore = 0;
    for (const e of moonToNatal) {
      const h = tzParts(new Date(e.ms), tz).hh;
      const awake = h >= 6 && h < 23;
      let w = e.kind === 'harm' ? rules.moonAspect : e.kind === 'tense' ? -rules.moonAspect : (e.target === 'Sun' || e.target === 'Moon' ? rules.moonAspect : 0);
      if (!awake) w *= 0.5;
      e.weight = w; moonScore += w;
    }
    moonScore = Math.max(-rules.moonCap, Math.min(rules.moonCap, moonScore));
    score += moonScore;

    // Luna: znamení, živel, fáze
    const moonSign = signOf(pos.Moon.lon);
    const moonEl = ELEMENT[moonSign], sunEl = ELEMENT[natal.sunSign];
    const elementHarmony = FRIENDLY[sunEl].includes(moonEl);
    if (elementHarmony) { score += rules.moonElement; reasons.push({ kind: 'harm', text: `Luna ${SIGN_LOC_V[moonSign]} – živel ${moonEl} ladí s tvým Sluncem (${sunEl})`, w: rules.moonElement }); }
    const phaseAngle = A.MoonPhase(T(noon));
    const illum = A.Illumination('Moon', T(noon)).phase_fraction;

    // VoC v rámci dne
    const vocToday = ctx.voc.filter(v => v.to > ds.getTime() && v.from < dayEnd.getTime()).map(v => ({ ...v, fromClip: Math.max(v.from, ds.getTime()), toClip: Math.min(v.to, dayEnd.getTime()) }));
    let vocAwake = 0;
    for (const v of vocToday) {
      const a = Math.max(v.fromClip, ds.getTime() + 8 * 3600000), b = Math.min(v.toClip, ds.getTime() + 22 * 3600000);
      if (b > a) vocAwake += (b - a) / 3600000;
    }
    if (vocAwake >= rules.vocHours) { score += rules.vocPenalty; reasons.push({ kind: 'tense', text: `Luna bez kurzu ${Math.round(vocAwake)} h z aktivní části dne`, w: rules.vocPenalty }); }

    // Merkur retro
    if (pos.Mercury.retro) { score += rules.mercuryRetro; reasons.push({ kind: 'tense', text: 'Merkur retrográdní – komunikace, technika, smlouvy s rezervou', w: rules.mercuryRetro }); }

    // Kp
    let kpInfo = null;
    if (kpForDay != null) {
      const kp = kpForDay.kp;
      let w = 0, txt = '';
      if (kp >= 6) { w = rules.kp.g2; txt = `Geomagnetická bouře (Kp ${kp}, G${Math.min(5, kp - 4)})`; }
      else if (kp >= 5) { w = rules.kp.g1; txt = `Slabá geomagnetická bouře (Kp ${kp}, G1)`; }
      else if (kp <= 3) { w = rules.kp.calm; txt = `Klidné kosmické počasí (Kp ${kp})`; }
      else txt = `Neklidné kosmické počasí (Kp ${kp})`;
      score += w;
      kpInfo = { ...kpForDay, weight: w, text: txt };
      if (w !== 0) reasons.push({ kind: w > 0 ? 'harm' : 'tense', text: txt + (kpForDay.source !== 'observed' ? ' – ' + (kpForDay.source === 'forecast' ? 'předpověď' : '27denní výhled') : ''), w });
    }

    // rezonance s "tvými" hvězdami
    const myStars = natal.stars.filter(s => s.mine);
    const resonance = [];
    for (const st of myStars) {
      for (const b of ['Sun', 'Venus', 'Mercury', 'Mars']) {
        const o = Math.abs(diff(pos[b].lon, st.lonNow));
        if (o <= rules.starOrb) resonance.push({ star: st, body: b, orb: o, text: `${BODY_CZ[b]} na tvé hvězdě ${st.name}` });
      }
    }
    const starTargets = myStars.map(s => ({ key: s.id, lon: s.lonNow }));
    const moonOnStars = moonAspectEvents(grid, starTargets, ['conj']).filter(e => e.ms >= ds.getTime() && e.ms < dayEnd.getTime());
    for (const e of moonOnStars) { const st = myStars.find(s => s.id === e.target); resonance.push({ star: st, body: 'Moon', ms: e.ms, text: `Luna přechází přes ${st.name} (${fmtTime(new Date(e.ms), tz)})` }); }
    // novoluní / úplněk dne u hvězdy
    const quarters = moonQuartersBetween(ds, dayEnd);
    for (const q of quarters) {
      if (q.quarter === 0 || q.quarter === 2) {
        const ml = lonOf('Moon', T(q.date));
        for (const st of myStars) { const o = Math.abs(diff(ml, st.lonNow)); if (o <= rules.starOrbPhase) resonance.push({ star: st, body: 'Moon', phase: q.quarter, text: `${q.quarter === 0 ? 'Novoluní' : 'Úplněk'} na hvězdě ${st.name}` }); }
      }
    }

    // poměr skóre -> barva
    const color = score >= rules.thresholds.harm ? 'harm' : score <= rules.thresholds.tense ? 'tense' : 'neutral';
    return {
      y, m, d, dayStart: ds, dayEnd, noon, pos, transits, background, fast, backgroundScore: Math.round(backgroundScore * 100) / 100, moonToNatal, moonScore, moonSign, illum, phaseAngle, elementHarmony,
      voc: vocToday, vocAwake, quarters, kp: kpInfo, resonance, reasons, score: Math.round(score * 100) / 100, color,
      mercuryRetro: pos.Mercury.retro,
    };
  }

  // ---------- úkazy ----------
  function moonAltitude(date, observer) {
    const eq = A.Equator('Moon', T(date), observer, true, true);
    return A.Horizon(T(date), observer, eq.ra, eq.dec, 'normal').altitude;
  }
  function sunAltitude(date, observer) {
    const eq = A.Equator('Sun', T(date), observer, true, true);
    return A.Horizon(T(date), observer, eq.ra, eq.dec, 'normal').altitude;
  }
  const KM_AU = 149597870.7;

  function skyEvents(d0, d1, observer, natal, tz) {
    const ev = [];
    const push = (date, cat, title, note, extra) => ev.push({ date, cat, title, note: note || '', ...(extra || {}) });
    // fáze Luny
    for (const q of moonQuartersBetween(d0, d1)) {
      const names = ['Novoluní', 'První čtvrt', 'Úplněk', 'Poslední čtvrt'];
      const ml = lonOf('Moon', T(q.date));
      let note = `Luna ${fmtLonText(ml)}`;
      let extra = { quarter: q.quarter };
      if (q.quarter === 0 || q.quarter === 2) {
        const distKm = A.EclipticGeoMoon(T(q.date)).dist * KM_AU;
        if (distKm < 360000) { note += ` · superúplněk (${Math.round(distKm / 1000)} tis. km)`; extra.special = 'super'; }
        else if (distKm > 405000) { note += ` · mikroúplněk (${Math.round(distKm / 1000)} tis. km)`; extra.special = 'micro'; }
        if (natal) for (const st of natal.stars.filter(s => s.mine)) { const o = Math.abs(diff(ml, st.lonNow)); if (o <= 2) { note += ` · ✦ na tvé hvězdě ${st.name}`; extra.resonance = true; } }
      }
      push(q.date, 'luna', names[q.quarter], note, extra);
    }
    // zatmění Luny
    let le = A.SearchLunarEclipse(T(d0));
    while (le && le.peak.date < d1) {
      const kind = { penumbral: 'polostínové', partial: 'částečné', total: 'úplné' }[le.kind] || le.kind;
      const altPeak = moonAltitude(le.peak.date, observer);
      const t0 = new Date(le.peak.date.getTime() - (le.sd_partial || le.sd_penum) * 60000);
      const t1 = new Date(le.peak.date.getTime() + (le.sd_partial || le.sd_penum) * 60000);
      const alt0 = moonAltitude(t0, observer), alt1 = moonAltitude(t1, observer);
      let vis;
      if (altPeak > 0 && alt0 > 0 && alt1 > 0) vis = 'od nás viditelné v celém průběhu';
      else if (altPeak > 0) vis = 'od nás viditelné částečně (Luna u obzoru)';
      else if (alt0 > 0 || alt1 > 0) vis = 'od nás jen okraj úkazu při východu/západu Luny';
      else vis = 'od nás neviditelné (Luna pod obzorem)';
      push(le.peak.date, 'zatmeni', `${kind.charAt(0).toUpperCase() + kind.slice(1)} zatmění Luny`, `maximum ${fmtTime(le.peak.date, tz)} · ${vis} · výška Luny v maximu ${Math.round(altPeak)}°` + (le.obscuration ? ` · zakryto ${Math.round(le.obscuration * 100)} %` : ''), { eclipse: true, altPeak });
      le = A.NextLunarEclipse(le.peak);
    }
    // zatmění Slunce (místní)
    try {
      let se = A.SearchLocalSolarEclipse(T(d0), observer);
      while (se && se.peak.time.date < d1) {
        const kind = { partial: 'částečné', annular: 'prstencové', total: 'úplné' }[se.kind] || se.kind;
        const alt = se.peak.altitude;
        const note = `maximum ${fmtTime(se.peak.time.date, tz)} · zakryto ${Math.round(se.obscuration * 100)} % · výška Slunce ${Math.round(alt)}°` + (alt < 0 ? ' (Slunce pod obzorem)' : '') + ` · od ${fmtTime(se.partial_begin.time.date, tz)} do ${fmtTime(se.partial_end.time.date, tz)}`;
        push(se.peak.time.date, 'zatmeni', `${kind.charAt(0).toUpperCase() + kind.slice(1)} zatmění Slunce nad tebou`, note, { eclipse: true });
        se = A.NextLocalSolarEclipse(se.peak.time, observer);
      }
    } catch (e) { /* žádné další */ }
    // rovnodennosti, slunovraty
    for (let yy = tzParts(d0, tz).y; yy <= tzParts(d1, tz).y; yy++) {
      const s = A.Seasons(yy);
      const list = [[s.mar_equinox, 'Jarní rovnodennost', 'Slunce vstupuje do Berana · začátek astrologického roku'], [s.jun_solstice, 'Letní slunovrat', 'Slunce vstupuje do Raka · nejdelší den'], [s.sep_equinox, 'Podzimní rovnodennost', 'Slunce vstupuje do Vah'], [s.dec_solstice, 'Zimní slunovrat', 'Slunce vstupuje do Kozoroha · nejdelší noc']];
      for (const [t, title, note] of list) if (t.date >= d0 && t.date < d1) push(t.date, 'slunce', title, note);
    }
    // opozice vnějších planet, elongace a konjunkce vnitřních

    for (const e of da.moonToNatal) {
      const t = e.kind === 'harm' ? 'Vstřícná chvíle' : e.kind === 'tense' ? 'Citlivější chvíle' : 'Luna se dotkne tvého bodu';
      const n = e.kind === 'harm' ? `Luna v dobrém úhlu na ${NATAL_LOC[e.target]} — pár desítek minut, dá se využít` : e.kind === 'tense' ? `Luna v napjatém úhlu na ${NATAL_LOC[e.target]} — krátké, nerozhoduj zrovna teď` : `Luna přechází přes ${NATAL_LOC[e.target]}`;

    for (const v of da.voc) {
      if (v.fromClip > da.dayStart.getTime()) at(v.fromClip, '∅', 'Luna bez kurzu', `až do ${v.toClip >= da.dayEnd.getTime() ? 'půlnoci' : K.fmtTime(new Date(v.toClip), tz)} nic nového nezačínej — dokončování a odpočinek jdou naopak dobře`, 'tense');

    }
    E.sort((a, b) => a.ms - b.ms);
    return E;
  }

      if (S.tab === 'nastaveni') renderSettings();
    } catch (e) { S.kpError = 'Data NOAA se nepodařilo stáhnout (' + (e.message || e) + ').'; if (S.tab === 'nastaveni') renderSettings(); }
  }

  // ===================== analýza dne (cache) =====================
  function analyze(y, m, d) {
    const key = `${activeId}|${y}-${m}-${d}|${S.kpUpdated}|${JSON.stringify(settings.rules)}|${settings.loc.lat},${settings.loc.lon}`;
    if (S.dayCache[key]) return S.dayCache[key];
    const kp = settings.showKp ? S.kpMap[K.isoDate(y, m, d)] || null : null;
    const da = K.dayAnalysis(y, m, d, S.natal, observer(), TZ, kp, rules());
    S.dayCache[key] = da;
    return da;
  }
  function monthEvents(y, m) {
    const key = `m|${activeId}|${y}-${m}|${settings.loc.lat},${settings.loc.lon}`;
    if (S.evCache[key]) return S.evCache[key];
    const d0 = K.dayStart(y, m, 1, TZ), d1 = K.addDays(K.dayStart(y, m, K.daysInMonth(y, m), TZ), 1);
    const ev = K.skyEvents(d0, d1, observer(), S.natal, TZ).concat(cometEvents(d0, d1));
    S.evCache[key] = ev; return ev;
  }
  function cometEvents(d0, d1) {
    const out = [];
    for (const line of String(settings.comets || '').split('\n')) {
      const mt = line.match(/^\s*(\d{4})-(\d{1,2})-(\d{1,2})\s*\|\s*([^|]+?)\s*(?:\|\s*(.*))?$/);
      if (!mt) continue;
      const date = K.localToDate(+mt[1], +mt[2], +mt[3], 21, 0, TZ);
      if (date >= d0 && date < d1) out.push({ date, cat: 'komety', title: mt[4], note: mt[5] || '', custom: true });
    }
    return out;
  }

  // ===================== KALENDÁŘ =====================
  function renderCalendar() {
    const v = $('#view-kalendar');
    if (!S.natal) { v.innerHTML = '<div class="card">Nejdřív zadej datum, čas a místo narození v Nastavení.</div>'; return; }
    const { y, m } = S;
    const n = K.daysInMonth(y, m);
    const offset = (K.tzParts(K.dayStart(y, m, 1, TZ), TZ).wd + 6) % 7;
    const evs = monthEvents(y, m);
    const evByDay = {};
    for (const e of evs) { const k = K.dateKey(e.date, TZ); (evByDay[k] = evByDay[k] || []).push(e); }
    let cells = '';
    for (let i = 0; i < offset; i++) cells += '<div class="cell empty"></div>';
    for (let d = 1; d <= n; d++) {
      const da = analyze(y, m, d);
      const key = K.isoDate(y, m, d);
      const dayEv = evByDay[key] || [];
      const alpha = Math.min(0.46, 0.14 + Math.abs(da.score) / 6 * 0.32).toFixed(2);
      const isToday = key === TODAY_KEY, isSel = S.sel.y === y && S.sel.m === m && S.sel.d === d;
      // jen jedna značka: to nejvýraznější, co ten den je
      let mk = '';
      const q = da.quarters.find(q => q.quarter === 0 || q.quarter === 2);
      if (dayEv.some(e => e.eclipse)) mk = '<span class="ec" title="zatmění">◉</span>';
      else if (da.resonance.length || dayEv.some(e => e.resonance)) mk = '<span class="st" title="tvá hvězda">✦</span>';
      else if (q) mk = `<span class="${q.quarter === 0 ? 'nm' : 'fm'}" title="${q.quarter === 0 ? 'novoluní' : 'úplněk'}">${q.quarter === 0 ? '●' : '○'}</span>`;
      else if (da.kp && da.kp.kp >= 5) mk = '<span class="kp" title="geomagnetická bouře">⚡</span>';
      const hasJ = !!jGet(key);
      const hasP = pGet(key).length > 0;
      const isPast = key < TODAY_KEY;
      cells += `<button type="button" class="cell ${da.color} ${isToday ? 'today' : ''} ${isSel ? 'sel' : ''} ${isPast ? 'past' : ''} ${hasJ ? 'noted' : ''} ${hasP ? 'planned' : ''}" style="--a:${alpha}" data-act="selDay" data-y="${y}" data-m="${m}" data-d="${d}" aria-label="${d}. ${K.MONTH_GEN[m - 1]} — ${TX.dayWord(da)}">
        <span class="d">${d}</span><span class="mk">${mk}</span>${hasP ? `<span class="pc" title="zapsané plány">${pGet(key).length}</span>` : ''}${moonSVG(da.phaseAngle, 12, q ? (q.quarter === 2 ? 'moon full' : 'moon new') : 'moon')}
      </button>`;
    }
    v.innerHTML = `
      ${todayHeroHTML()}
      ${aheadHTML()}
      <div class="monthbar">
        <button class="navbtn" data-act="prevMonth" aria-label="Předchozí měsíc">‹</button>
        <div class="mn">${K.MONTH_CZ[m - 1].charAt(0).toUpperCase() + K.MONTH_CZ[m - 1].slice(1)}<em>${y}</em></div>
        <div class="row"><button type="button" class="btn ghost small" data-act="today">Dnes</button><button class="navbtn" data-act="nextMonth" aria-label="Další měsíc">›</button></div>
      </div>
      <div class="weekdays"><span>Po</span><span>Út</span><span>St</span><span>Čt</span><span>Pá</span><span>So</span><span>Ne</span></div>
      <div class="grid">${cells}</div>
      <div class="legend"><span><i style="background:linear-gradient(90deg,#8FE8BE,#2F9E72)"></i>plyne to</span><span><i style="background:linear-gradient(90deg,#FFB598,#C9563A)"></i>větší tření</span><span>✦ tvá hvězda</span><span>◉ zatmění</span><span>● ○ novoluní / úplněk</span><span style="color:var(--gold)">1</span><span style="margin-left:-8px">zapsané plány</span><span style="color:var(--gold)">✎</span><span style="margin-left:-8px">zápis dne</span></div>
      ${electHTML()}
      <details class="legend-more"><summary><span class="tri" aria-hidden="true"></span>Co značky znamenají?</summary>
        <p><b style="color:#8FE8BE"><i class="lg" style="background:linear-gradient(90deg,#8FE8BE,#2F9E72)"></i>Zelený proužek</b> — den, kdy jsou energie více v souladu s tvým osobním horoskopem. Věci mohou jít přirozeněji a s menším úsilím.</p>
        <p><b style="color:#FFB598"><i class="lg" style="background:linear-gradient(90deg,#FFB598,#C9563A)"></i>Lososový proužek</b> — den s větším odporem nebo napětím. Některé věci mohou vyžadovat více energie, trpělivosti a odpočinku.</p>
        <p><b>✦ Tvá hvězda</b> — tento den se tě postavení Luny nebo planet dotýká osobně. Něco může být výraznější, důležitější nebo citlivější právě pro tebe. Hvězda na zeleném dni značí příznivý čas pro důležité kroky. Hvězda na lososovém dni znamená silné osobní téma, ale zároveň náročnější energii — spíš vnímej, co se děje, než abys tlačil/a na výsledek.</p>
        <p><b>◉ Zatmění</b> — energeticky výrazné novoluní nebo úplněk. Tradičně se doporučuje nechat velká rozhodnutí a nové začátky na jiný den.</p>
        <p><b>● / ○ Novoluní a úplněk</b> — novoluní podporuje nové záměry a začátky, úplněk přináší vyvrcholení, uvědomění a završení.</p>
        <p>Barvy i značky jsou vypočítané podle tvého osobního horoskopu, takže u každého člověka mohou vycházet jinak. Po rozkliknutí konkrétního dne se dozvíš, proč má právě takové označení.</p>
        <button type="button" class="legend-close" data-act="closeLegend">▲ &nbsp;Sbalit vysvětlivky</button>
      </details>
      <div class="day" id="dayDetail">${dayDetailHTML(S.sel.y, S.sel.m, S.sel.d, evByDay)}</div>`;
  }

  // dnešní shrnutí nahoře
  function todayHeroHTML() {
    const da = analyze(np.y, np.m, np.d);

      <span class="ht-date">dnes · ${K.WEEKDAY_CZ[np.wd]} ${np.d}. ${K.MONTH_GEN[np.m - 1]}${phh ? ` · ${K.fmtTime(phh.sunrise, TZ)} – ${K.fmtTime(phh.sunset, TZ)}` : ''}${nd ? ' · ' + nd : ''}</span>
      <span class="ht-head"><span class="ht-word">${TX.dayWord(da)}</span><span class="ht-medal">${moonSVG(da.phaseAngle, 46, 'moon hm')}</span></span>
      <span class="ht-moon">${moonSVG(da.phaseAngle, 18)} Luna ${K.SIGN_LOC_V[da.moonSign]} · ${ph.name.replace(' Luna', '')} · ${Math.round(da.illum * 100)}&nbsp;%</span>
      <span class="ht-div"></span>

      ${cost.length ? `<span class="ht-div"></span><span class="ht-row ht-cost"><i class="ht-ic cost">✳</i><b>Nepříznivé</b><span class="tx">${esc(cost[0].text)}</span></span>` : ''}

  // pás nejbližších dnů
  function aheadHTML() {
    let out = '';
    for (let i = 0; i < 14; i++) {
      const dt = K.addDays(K.dayStart(np.y, np.m, np.d, TZ), i + 0.5);
      const p = K.tzParts(dt, TZ);
      const da = analyze(p.y, p.m, p.d);
      const key = K.isoDate(p.y, p.m, p.d);
      const sel = S.sel.y === p.y && S.sel.m === p.m && S.sel.d === p.d;
      out += `<button class="a ${da.color} ${key === TODAY_KEY ? 'today' : ''} ${sel ? 'sel' : ''}" data-act="selDay" data-y="${p.y}" data-m="${p.m}" data-d="${p.d}">
        <span class="wd">${i === 0 ? 'dnes' : K.WEEKDAY_CZ[p.wd].slice(0, 2)}</span><span class="dd">${p.d}</span><span class="wo">${TX.dayWord(da)}</span></button>`;
    }
    return `<div class="h3" style="margin-top:14px">Nejbližší dny</div><div class="ahead">${out}</div>`;
  }

  function dayDetailHTML(y, m, d, evByDay) {
    const da = analyze(y, m, d);
    const obs = observer();
    const ph = K.planetaryHours(y, m, d, obs, TZ);
    const pp = K.tzParts(K.addDays(da.dayStart, -0.5), TZ);
    const phPrev = K.planetaryHours(pp.y, pp.m, pp.d, obs, TZ);
    const ld = K.lunarDay(da.noon, obs);
    const key = K.isoDate(y, m, d);
    const dayEv = (evByDay && evByDay[key]) || monthEvents(y, m).filter(e => K.dateKey(e.date, TZ) === key);
    const isToday = key === TODAY_KEY;
    const moonrise = A.SearchRiseSet('Moon', obs, +1, A.MakeTime(da.dayStart), 1), moonset = A.SearchRiseSet('Moon', obs, -1, A.MakeTime(da.dayStart), 1);

    const gen = TX.generalItems(da, dayEv, rules());
    const per = TX.personalItems(da, rules());
    const wins = TX.windows(da, ph, TZ);
    const bullet = (it) => `<li class="${it.star ? 'mine' : ''}"><span>${esc(it.text)}${it.tag ? `<span class="tag">${it.tag}</span>` : ''}${it.note ? `<span class="n">${esc(it.note)}</span>` : ''}</span></li>`;
    const go = gen.go.concat(per.go), cost = gen.cost.concat(per.cost);

    return `
      <div class="day-head">
        <div class="day-title"><small>${isToday ? 'dnes · ' : ''}${K.WEEKDAY_CZ[K.tzParts(da.noon, TZ).wd]}</small>${d}. ${K.MONTH_GEN[m - 1]} ${y}</div>

  // ===================== najít vhodný den (elekce) =====================
  const ELECT_CATS = [
    { id: 'smlouva', label: 'Smlouva a dohoda', rules: { noRetro: 1, vocPlus: 1, wax: .5 }, subs: [['podpis', 'Podpis smlouvy'], ['urad', 'Úřad · žádost'], ['dohoda', 'Důležitá dohoda']] },
    { id: 'penize', label: 'Peníze a větší nákup', rules: { noRetro: 1, wax: 1 }, subs: [['nakup', 'Větší nákup'], ['investice', 'Investice'], ['uver', 'Úvěr · financování'], ['koupe', 'Koupě auta · nemovitosti']] },
    { id: 'projekt', label: 'Projekt a podnikání', rules: { newMoon: 1, vocPlus: 1 }, subs: [['zacit', 'Začít projekt'], ['web', 'Spustit web'], ['provoz', 'Otevřít provoz'], ['produkt', 'Představit produkt']] },
    { id: 'prace', label: 'Práce a kariéra', rules: { noRetro: 1, wax: .5 }, subs: [['pohovor', 'Pohovor'], ['nastup', 'Nástup'], ['zvyseni', 'Žádost o zvýšení'], ['prezentace', 'Prezentace · vystoupení'], ['zkouska', 'Zkouška · přihláška']] },
    { id: 'laska', label: 'Láska a vztahy', rules: { wax: .5, venusSign: 1, venusNoRetro: 1 }, subs: [['rande', 'Rande'], ['setkani', 'Důležité setkání'], ['zasnuby', 'Zásnuby'], ['svatba', 'Svatba', { vocPlus: 1 }]] },
    { id: 'bydleni', label: 'Stěhování a bydlení', rules: { wax: .5, noKp: 1, retroMinus: .5 }, subs: [['stehovani', 'Stěhování'], ['najem', 'Nové bydlení · nájem']] },
    { id: 'cesta', label: 'Cesta a dovolená', rules: { noKp: 1, retroMinus: 1 }, subs: [['odjezd', 'Odjezd na cestu'], ['dovolena', 'Dovolená'], ['presun', 'Přesun · logistika']] },
    { id: 'rozhovor', label: 'Důležitý rozhovor', rules: { noRetro: 1, vocPlus: 1, airSign: 1 }, subs: [['vyjednavani', 'Vyjednávání'], ['citlive', 'Citlivé téma'], ['zadost', 'Žádost · prosba']] },
    { id: 'zakrok', label: 'Plánovaný zákrok', rules: { wane: 1, avoidFull: 1, noKp: 1, health: 1 }, subs: [['operace', 'Zákrok · operace'], ['zubar', 'Zubař']] },
  ];
  function electCfg() {
    const cat = ELECT_CATS.find(c => c.id === S.elek.cat);
    if (!cat) return null;
    const sub = cat.subs.find(x => x[0] === S.elek.sub) || cat.subs[0];
    return { ...cat.rules, ...(sub[2] || {}), catLabel: cat.label, subLabel: sub[1], health: cat.rules.health };
  }
  function electDay(cfg, y, m, d, evs) {
    const da = analyze(y, m, d);
    const key = K.isoDate(y, m, d);
    if (evs.some(e => e.eclipse && K.dateKey(e.date, TZ) === key)) return null;
    if (cfg.noRetro && da.mercuryRetro) return null;
    if (cfg.venusNoRetro && da.pos.Venus.retro) return null;
    if (cfg.noKp && da.kp && da.kp.kp >= 5) return null;
    const phA = da.phaseAngle;
    if (cfg.avoidFull && phA >= 160 && phA <= 200) return null;
    let sc = da.score, why = [];
    if (cfg.wax && phA < 175) { sc += cfg.wax; why.push('dorůstající Luna'); }
    if (cfg.wane && phA >= 195 && phA < 350) { sc += 1; why.push('couvající Luna'); }
    if (cfg.newMoon && phA >= 5 && phA < 95) { sc += 1; why.push('Luna mezi novem a první čtvrtí'); }
    if (cfg.venusSign && (da.moonSign === 1 || da.moonSign === 6)) { sc += .5; why.push('Luna ve znamení Venuše'); }
    if (cfg.airSign && (da.moonSign === 2 || da.moonSign === 6 || da.moonSign === 10)) { sc += .5; why.push('Luna ve vzdušném znamení'); }
    if (cfg.vocPlus && !da.voc.length) { sc += .5; why.push('Luna celý den v kurzu'); }
    if (cfg.retroMinus && da.mercuryRetro) { sc -= cfg.retroMinus; why.push('Merkur retrográdní'); }
    if (da.color === 'harm') why.unshift('celkově příznivý den');
    return { key, y, m, d, sc, da, why };
  }
  function electRun() {
    const cfg = electCfg();
    if (!cfg) { S.elek.results = null; return; }
    const out = [], evCacheM = {};
    for (let i = 1; i <= S.elek.span; i++) {
      const dt = K.addDays(K.dayStart(np.y, np.m, np.d, TZ), i + 0.5);
      const pp = K.tzParts(dt, TZ);
      const mk = pp.y + '-' + pp.m;
      if (!evCacheM[mk]) evCacheM[mk] = monthEvents(pp.y, pp.m);
      const r = electDay(cfg, pp.y, pp.m, pp.d, evCacheM[mk]);
      if (r) out.push(r);
    }
    out.sort((a, b) => b.sc - a.sc || a.key.localeCompare(b.key));
    S.elek.results = out.slice(0, 6);
  }
  function electHTML() {
    const cat = ELECT_CATS.find(c => c.id === S.elek.cat);
    const cats = `<div class="row echips">${ELECT_CATS.map(c => `<button type="button" class="chip ${S.elek.cat === c.id ? 'on' : ''}" data-act="elekCat" data-c="${c.id}">${c.label}</button>`).join('')}</div>`;
    let body = '';
    if (cat) {
      const subOn = (cat.subs.find(x => x[0] === S.elek.sub) || cat.subs[0])[0];
      body += `<div class="row echips sub">${cat.subs.map(x => `<button type="button" class="chip small ${subOn === x[0] ? 'on' : ''}" data-act="elekSub" data-s="${x[0]}">${x[1]}</button>`).join('')}</div>`;
      body += `<div class="row echips span"><span class="elbl">Rozsah</span>${[14, 30, 60].map(n => `<button type="button" class="chip small ${+S.elek.span === n ? 'on' : ''}" data-act="elekSpan" data-n="${n}">${n} dní</button>`).join('')}</div>`;

        body += `<p class="note">Nejlepší dny pro: ${cfg.subLabel.toLowerCase()}. Řazeno podle skóre dne s příplatky za to, co dané věci svědčí; vyřazeny dny zatmění${cfg.noRetro ? ', retrográdního Merkuru' : ''}${cfg.venusNoRetro ? ', retrográdní Venuše' : ''}${cfg.noKp ? ', geomagnetických bouří' : ''}${cfg.avoidFull ? ' a okolí úplňku' : ''}.${cfg.health ? ' Jen orientačně — termín zákroku se vždy řídí tím, co řekne lékař.' : ''}</p>`;
      }
    }
    return `<div class="h3">Najít vhodný den</div><div class="card elect">
      <p class="elq">Pro co hledám vhodný den?</p>
      ${cats}${body}</div>`;
  }
