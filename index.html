.navbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);font-size:18px;display:grid;place-items:center}

.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:4px;text-shadow:var(--halo)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{position:relative;aspect-ratio:1/.94;border-radius:14px;border:1px solid var(--glass-line);
  background:var(--glass);-webkit-
  padding:8px 8px 6px;text-align:left;overflow:hidden;box-shadow:0 2px 10px var(--glass-shadow);
  transition:transform .16s ease,box-shadow .16s ease}

.plist .px:hover{color:var(--tense);border-color:var(--tense)}
.planadd{display:grid;grid-template-columns:96px 1fr auto;gap:7px}
.planadd input{font:inherit;font-size:14px;color:var(--text);background:var(--field);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;min-width:0}
.planadd input::placeholder{color:var(--muted)}
@media (max-width:400px){.planadd{grid-template-columns:86px 1fr auto}}
.tl .e.mine .dot{color:var(--gold)}
.tl .e.mine .x{font-weight:600}
.cell.planned .d:after{content:'◆';font-size:8px;color:var(--gold);vertical-align:6px;margin-left:3px;font-family:var(--body)}
/* text ležící přímo na obraze */
.h2,.h3,.lede,.note,.legend,.weekdays,.striplegend,.ev-month,.monthbar .mn,.day-title,.day-title small{text-shadow:var(--halo)}
[data-bg="plain"] .h2,[data-bg="plain"] .h3,[data-bg="plain"] .lede,[data-bg="plain"] .note,[data-bg="plain"] .legend,[data-bg="plain"] .weekdays,[data-bg="plain"] .striplegend,[data-bg="plain"] .ev-month,[data-bg="plain"] .monthbar .mn,[data-bg="plain"] .day-title,[data-bg="plain"] .day-title small{text-shadow:none}
/* diář */
.panel.jr{border-color:var(--gold2)}
.panel.jr h4{color:var(--gold)}
.rates{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.rate{padding:6px 11px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;color:var(--muted);background:transparent;transition:transform .12s ease}
.rate:hover{transform:translateY(-1px)}
.rate.on{color:var(--text);border-color:var(--gold);background:var(--gold-soft);font-weight:500}
.rate.harm.on{border-color:rgba(var(--harm-rgb),.7);background:var(--harm-soft);color:var(--harm)}
.rate.tense.on{border-color:rgba(var(--tense-rgb),.7);background:var(--tense-soft);color:var(--tense)}
.jnote{width:100%;font:inherit;font-size:14.5px;color:var(--text);background:var(--field);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;resize:vertical;min-height:64px}
.jnote::placeholder{color:var(--muted)}
.jitem{display:grid;grid-template-columns:46px 1fr;gap:10px;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border-radius:12px;
  border:1px solid var(--glass-line);background:var(--glass);-webkit-box-shadow:0 2px 8px var(--glass-shadow);transition:transform .14s ease}
.jitem:hover{transform:translateY(-1px)}
.jitem.harm{border-color:rgba(var(--harm-rgb),.4)}
.jitem.tense{border-color:rgba(var(--tense-rgb),.4)}
.jitem .jd{font-family:var(--display);font-size:12px;color:var(--muted);text-align:center;line-height:1.15}
.jitem .jd b{display:block;font-size:21px;color:var(--text);font-weight:600}
.jitem .jt{min-width:0}
.jitem .jc{display:block;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.jitem .n{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}
.cell.noted:after{content:'';position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.9}
/* plán dne */
.panel.pl h4{color:var(--text)}
.plist{list-style:none;margin:0 0 9px;padding:0}
.plist li{display:grid;grid-template-columns:48px 1fr 26px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist .pt{font-family:var(--mono);font-size:12.5px;color:var(--gold);font-variant-numeric:tabular-nums}
.plist .pn{font-size:14px;word-break:break-word}
.plist .px{width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);color:var(--muted);font-size:14px;line-height:1;display:grid;place-items:center}
.plist .px:hover{color:var(--tense);border-color:var(--tense)}
.planadd{display:grid;grid-template-columns:92px 1fr auto;gap:7px}
.planadd input{font:inherit;font-size:14px;color:var(--text);background:var(--field);border:1px solid var(--line2);border-radius:9px;padding:8px 9px;min-width:0}
.planadd input::placeholder{color:var(--muted)}
.tl .e.mine .dot{color:var(--text)}
.tl .e.mine .x{font-weight:600}
.cell.planned .d:after{content:'◆';font-size:8px;vertical-align:6px;margin-left:3px;color:var(--text);opacity:.75;font-family:var(--body)}
@media (max-width:420px){.planadd{grid-template-columns:84px 1fr auto}}
/* časová osa dne */
.tl{margin:10px 0 4px;position:relative;padding:10px 14px 10px 4px;background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;box-shadow:0 2px 10px var(--glass-shadow)}
.tl:before{content:'';position:absolute;left:57px;top:18px;bottom:18px;width:1px;background:linear-gradient(180deg,transparent,var(--line2) 12%,var(--line2) 88%,transparent)}
.tl .e{display:grid;grid-template-columns:52px 18px 1fr;gap:0 10px;align-items:start;padding:6px 0;position:relative}
.tl .t{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right;padding-top:2px;font-variant-numeric:tabular-nums}
.tl .dot{position:relative;z-index:1;width:18px;text-align:center;font-size:13px;line-height:1.35;color:var(--gold)}
.tl .e.harm .dot{color:var(--harm)}.tl .e.tense .dot{color:var(--tense)}
.tl .x{font-size:14px;line-height:1.35}
.tl .x .n{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.tl .e.now{background:linear-gradient(90deg,var(--gold-soft),transparent 70%);border-radius:8px}
.tl .e.now .t{color:var(--gold)}
.tl .e.span .dot:after{content:'';position:absolute;left:50%;top:18px;bottom:-14px;width:2px;transform:translateX(-50%);background:repeating-linear-gradient(180deg,currentColor 0 3px,transparent 3px 6px);opacity:.5}
/* detail dne */
.day{margin-top:16px;border-top:1px solid var(--line2);padding-top:14px}
.day-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.day-title{font-family:var(--display);font-size:28px;font-weight:500;line-height:1.05;text-shadow:var(--halo)}
.day-title small{display:block;font-family:var(--body);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.score{font-family:var(--mono);font-size:12px;color:var(--muted)}
/* pás dne – podpis aplikace */
.strip{position:relative;height:74px;margin:14px 0 6px;border-radius:10px;overflow:hidden;background:var(--strip-bg);border:1px solid var(--line)}
.strip .sky{position:absolute;inset:0}
.strip .daylight{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,rgba(var(--sun-rgb),.26),rgba(var(--sun-rgb),.07));border-left:1px solid rgba(var(--sun-rgb),.55);border-right:1px solid rgba(var(--sun-rgb),.55)}
.strip .voc{position:absolute;top:0;bottom:18px;background:repeating-linear-gradient(135deg,rgba(var(--tense-rgb),0) 0 5px,rgba(var(--tense-rgb),.35) 5px 7px)}
.strip .hour{position:absolute;bottom:0;height:16px;border-right:1px solid var(--strip-line)}
.strip .hour.cur{outline:1.5px solid var(--gold);outline-offset:-1.5px;z-index:2}
.strip .hl{position:absolute;top:4px;font-family:var(--mono);font-size:10px;color:var(--muted);transform:translateX(-50%)}
.strip .tick{position:absolute;top:20px;transform:translateX(-50%);font-size:13px;line-height:1;text-align:center}
.strip .tick.harm{color:var(--harm)}.strip .tick.tense{color:var(--tense)}.strip .tick.neutral{color:var(--muted)}
.strip .tick b{display:block;font-family:var(--mono);font-weight:400;font-size:9px;color:var(--muted);margin-top:1px}
.strip .now{position:absolute;top:0;bottom:0;width:1.5px;background:var(--gold);box-shadow:0 0 8px var(--gold);z-index:3}
.strip .sunmark{position:absolute;top:42px;font-size:11px;color:var(--sun);transform:translateX(-50%)}
.strip .moonmark{position:absolute;top:42px;font-size:11px;color:var(--moon);transform:translateX(-50%)}
.striplegend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:0 2px 8px}
.ph-table{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;font-size:12.5px}
.ph-table div{display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid var(--line);font-family:var(--mono)}
.ph-table div.cur{color:var(--gold)}
.ph-table div span:first-child{font-family:var(--body)}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px;letter-spacing:.04em;list-style:none;padding:6px 0}
details summary::before{content:'▸ ';color:var(--gold)}details[open] summary::before{content:'▾ '}
/* úkazy */
.ev-month{font-family:var(--display);font-size:22px;margin:20px 0 4px;color:var(--gold);text-shadow:var(--halo)}
.ev{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:11px 14px;margin:6px 0;background:var(--glass);border:1px solid var(--glass-line);border-radius:12px;box-shadow:0 2px 8px var(--glass-shadow)}
.ev .dt{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.3}
.ev .dt b{display:block;font-family:var(--display);font-weight:600;font-size:18px;color:var(--text)}
.ev .ti{font-weight:500}.ev .ti .c{font-size:13px;margin-right:6px}
.ev .no{color:var(--muted);font-size:12.5px;margin-top:2px}
.ev.res .ti{color:var(--gold)}
/* efemeridy */
.eph-wrap{overflow-x:auto;margin:8px 0;padding:10px 12px;background:var(--glass);border:1px solid var(--glass-line);border-radius:12px;box-shadow:0 2px 8px var(--glass-shadow)}
table.eph{border-collapse:collapse;font-family:var(--mono);font-size:11.5px;white-space:nowrap}
table.eph th{font-weight:500;color:var(--gold);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);font-family:var(--display);font-size:16px}
table.eph td{padding:4px 8px;border-bottom:1px solid var(--line)}
table.eph td:first-child{color:var(--muted)}
table.eph tr.phase td:first-child{color:var(--gold)}
table.eph .r{color:var(--tense)}
/* nativ */
.wheel{display:block;margin:6px auto;max-width:360px;width:100%}
table.pts{width:100%;border-collapse:collapse;font-size:13px;background:var(--glass);border-radius:12px;overflow:hidden;box-shadow:0 2px 8px var(--glass-shadow)}
table.pts td:first-child{padding-left:12px}table.pts td:last-child{padding-right:12px}
table.pts td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.pts td.g{font-family:var(--display);font-size:18px;width:28px;color:var(--gold)}
table.pts td.p{font-family:var(--mono);white-space:nowrap}
.star{padding:12px 14px;margin:8px 0;background:var(--glass);border:1px solid var(--glass-line);border-radius:12px;box-shadow:0 2px 8px var(--glass-shadow)}
.star .nm{font-family:var(--display);font-size:19px;font-weight:600}
.star .nm em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}
.star .why{font-size:12.5px;color:var(--muted);margin-top:2px}
.star .why span{display:block}
.star.main .nm{color:var(--gold)}
/* nastavení */
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.form label.wide{grid-column:1/-1}
.form input,.form select,.form textarea{font:inherit;font-size:15px;letter-spacing:0;text-transform:none;color:var(--text);background:var(--field);border:1px solid var(--line2);border-radius:9px;padding:9px 10px;min-width:0}
.form textarea{min-height:90px;font-family:var(--mono);font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin:6px 0;text-shadow:var(--halo)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--gold2);color:var(--text);padding:10px 16px;border-radius:12px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.loading{padding:30px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  const dayStart = (y, m, d, tz) => localToDate(y, m, d, 0, 0, tz);
  const addDays = (date, n) => new Date(date.getTime() + n * 86400000);
  const T = (date) => A.MakeTime(date);
  const isoDate = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  function dateKey(date, tz) { const p = tzParts(date, tz); return isoDate(p.y, p.m, p.d); }
  function fmtTime(date, tz) { const p = tzParts(date, tz); return `${p.hh}:${String(p.mm).padStart(2, '0')}`; }
  function fmtDateCz(date, tz) { const p = tzParts(date, tz); return `${p.d}. ${p.m}. ${p.y}`; }
  function fmtDateLong(date, tz) { const p = tzParts(date, tz); return `${WEEKDAY_CZ[p.wd]} ${p.d}. ${MONTH_GEN[p.m - 1]} ${p.y}`; }
  function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }

  // ---------- polohy ----------
  function lonOf(body, time) {
    if (body === 'Sun') return A.SunPosition(time).elon;
    if (body === 'Moon') return A.EclipticGeoMoon(time).lon;
    return A.Ecliptic(A.GeoVector(body, time, true)).elon;
  }
  function meanNode(time) {
    const Tc = (time.tt) / 36525.0; // TT dny od J2000
    let om = 125.0445479 - 1934.1362891 * Tc + 0.0020754 * Tc * Tc + Tc * Tc * Tc / 467441 - Tc * Tc * Tc * Tc / 60616000;
    return norm(om);
  }
  // polohy všech těles v daný okamžik + rychlost (°/den) + retrogradita
  function positions(date) {
    const t = T(date), t1 = T(new Date(date.getTime() + 86400000));
    const out = {};
    for (const b of BODIES) {
      const l0 = lonOf(b, t), l1 = lonOf(b, t1);
      const sp = diff(l1, l0);
      out[b] = { lon: l0, speed: sp, retro: sp < 0 && b !== 'Sun' && b !== 'Moon' };
    }
    out.Node = { lon: meanNode(t), speed: -0.053, retro: true };
    return out;
  }
  const signOf = (lon) => Math.floor(norm(lon) / 30);
  const degInSign = (lon) => norm(lon) - signOf(lon) * 30;
  function fmtLon(lon, withSign = true) {
    const s = signOf(lon), d = degInSign(lon);
    const dd = Math.floor(d), mm = Math.floor((d - dd) * 60);
    return `${dd}°${String(mm).padStart(2, '0')}′` + (withSign ? ` ${SIGN_GLYPH[s]}` : '');
  }
  function fmtLonText(lon) { const s = signOf(lon), d = degInSign(lon); return `${Math.floor(d)}°${String(Math.floor((d - Math.floor(d)) * 60)).padStart(2, '0')}′ ${SIGNS[s]}`; }

  // ---------- stálice ----------
  function starLonLat(star, time) {
    const v = A.VectorFromSphere(new A.Spherical(star.dec, star.ra, 1), time);
    const ect = A.RotateVector(A.Rotation_EQJ_ECT(time), v);
    const s = A.SphereFromVector(ect);
    return { lon: norm(s.lon), lat: s.lat };
  }
  const SLOT = 'Star1';
  function defineStar(star) { A.DefineStar(SLOT, star.ra / 15, star.dec, star.ly); return SLOT; }

  // ---------- Asc, MC, domy (Placidus) ----------
  function ascMC(time, lat, lon) {
    const gst = A.SiderealTime(time); // hodiny
    const ramc = norm((gst + lon / 15) * 15);
    const eps = A.e_tilt(time).tobl;
    const r = ramc * DEG, e = eps * DEG, f = lat * DEG;
    const mc = norm(Math.atan2(Math.sin(r), Math.cos(r) * Math.cos(e)) * RAD);
    const asc = norm(Math.atan2(Math.cos(r), -(Math.sin(r) * Math.cos(e) + Math.tan(f) * Math.sin(e))) * RAD);
    return { ramc, eps, mc, asc, lst: norm(ramc) / 15 };
  }
  function placidus(ramc, lat, eps) {
    const f = lat * DEG, e = eps * DEG;
    const raToLon = (ra) => norm(Math.atan2(Math.sin(ra * DEG), Math.cos(ra * DEG) * Math.cos(e)) * RAD);
    const semiArc = (ra) => { // denní půloblouk bodu ekliptiky s danou RA
      const tanDec = Math.tan(e) * Math.sin(ra * DEG);
      let c = -Math.tan(f) * tanDec;
      c = Math.max(-1, Math.min(1, c));
      return Math.acos(c) * RAD;
    };
    const solve = (start, fn) => { let ra = start; for (let i = 0; i < 40; i++) ra = fn(ra); return ra; };
    const ra11 = solve(ramc + 30, ra => ramc + semiArc(ra) / 3);
    const ra12 = solve(ramc + 60, ra => ramc + 2 * semiArc(ra) / 3);
    const ra2 = solve(ramc + 120, ra => ramc + 60 + 2 * semiArc(ra) / 3);
    const ra3 = solve(ramc + 150, ra => ramc + 120 + semiArc(ra) / 3);
    const c = new Array(13);
    c[10] = raToLon(ramc); c[11] = raToLon(ra11); c[12] = raToLon(ra12);
    c[2] = raToLon(ra2); c[3] = raToLon(ra3);
    c[4] = norm(c[10] + 180); c[5] = norm(c[11] + 180); c[6] = norm(c[12] + 180);
    c[8] = norm(c[2] + 180); c[9] = norm(c[3] + 180);
    return c; // c[1] a c[7] doplní volající (Asc/Desc)
  }
  function houseOf(lon, cusps) {
    for (let h = 1; h <= 12; h++) {
      const a = cusps[h], b = cusps[h === 12 ? 1 : h + 1];
      const span = norm(b - a), x = norm(lon - a);
      if (x < span) return h;
    }
    return 12;
  }

  // ---------- aspekty ----------
  function aspectBetween(lonA, lonB, orbs) {
    const d = Math.abs(diff(lonA, lonB));
    let best = null;
    for (const asp of ASPECTS) {
      const orb = Math.abs(d - asp.angle);
      const maxOrb = orbs[asp.key] != null ? orbs[asp.key] : orbs.default;
      if (orb <= maxOrb && (!best || orb < best.orb)) best = { ...asp, orb, sep: d };
    }
    return best;
  }

  // ---------- nativ ----------
  function natalChart(profile, nowDate) {
    const date = localToDate(profile.y, profile.m, profile.d, profile.hh, profile.mm, profile.tz || TZ);
    const time = T(date);
    const nowTime = T(nowDate || new Date());
    const observer = new A.Observer(profile.lat, profile.lon, profile.alt || 200);
    const pos = positions(date);
    const ang = ascMC(time, profile.lat, profile.lon);
    const cusps = placidus(ang.ramc, profile.lat, ang.eps);
    cusps[1] = ang.asc; cusps[7] = norm(ang.asc + 180);
    const points = {};
    for (const b of BODIES) points[b] = { lon: pos[b].lon, retro: pos[b].retro, speed: pos[b].speed, house: houseOf(pos[b].lon, cusps) };
    points.Node = { lon: pos.Node.lon, retro: true, house: houseOf(pos.Node.lon, cusps) };
    points.Asc = { lon: ang.asc, house: 1 };
    points.MC = { lon: ang.mc, house: 10 };
    // stálice v nativu
    const stars = STARS.map(st => {
      const ll = starLonLat(st, time);
      const conj = [];
      for (const k of ['Sun', 'Moon', 'Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune', 'Pluto', 'Asc', 'MC']) {
        const o = Math.abs(diff(ll.lon, points[k].lon));
        if (o <= 1.0) conj.push({ point: k, orb: o });
      }
      return { ...st, lon: ll.lon, lat: ll.lat, lonNow: starLonLat(st, nowTime).lon, house: houseOf(ll.lon, cusps), conj, angles: [], parans: [] };
    });
    // hvězdy na úhlech v okamžiku narození + parany dne narození
    const latR = profile.lat * DEG;
    const hourAngleInfo = (body, t) => {
      const eq = A.Equator(body, t, observer, true, true);
      const ha = norm((A.SiderealTime(t) + profile.lon / 15 - eq.ra) * 15); // 0..360, stupně
      let c = -Math.tan(latR) * Math.tan(eq.dec * DEG);
      const riseHA = (c >= -1 && c <= 1) ? Math.acos(c) * RAD : null; // null = cirkumpolární / nikdy nevychází
      return { ha, riseHA, dec: eq.dec };
    };
    const angleHits = (info, orb) => {
      const hits = [];
      const d0 = Math.abs(diff(info.ha, 0)); if (d0 <= orb) hits.push({ angle: 'kulminuje', orb: d0 });
      const d180 = Math.abs(diff(info.ha, 180)); if (d180 <= orb) hits.push({ angle: 'antikulminuje', orb: d180 });
      if (info.riseHA != null) {
        const dr = Math.abs(diff(info.ha, -info.riseHA)); if (dr <= orb) hits.push({ angle: 'vychází', orb: dr });
        const ds = Math.abs(diff(info.ha, info.riseHA)); if (ds <= orb) hits.push({ angle: 'zapadá', orb: ds });
      }
      return hits;
    };
    const ORB_ANGLE = 1.0, ORB_PARAN = 1.0;
    const dStart = dayStart(profile.y, profile.m, profile.d, profile.tz || TZ);
    const tStart = T(dStart);
    for (const st of stars) {
      const body = defineStar(st);
      const info = hourAngleInfo(body, time);
      st.neverRises = info.riseHA == null && info.dec < 0;
      st.circumpolar = info.riseHA == null && info.dec > 0;
      st.angles = angleHits(info, ORB_ANGLE);
      // parany: 4 úhly hvězdy během dne narození
      const events = [];
      const up = A.SearchHourAngle(body, observer, 0, tStart, +1); if (up && up.time.date < addDays(dStart, 1)) events.push({ angle: 'kulminuje', time: up.time });
      const low = A.SearchHourAngle(body, observer, 12, tStart, +1); if (low && low.time.date < addDays(dStart, 1)) events.push({ angle: 'antikulminuje', time: low.time });
      if (info.riseHA != null) {
        const r = A.SearchAltitude(body, observer, +1, tStart, 1, 0); if (r) events.push({ angle: 'vychází', time: r });
        const s = A.SearchAltitude(body, observer, -1, tStart, 1, 0); if (s) events.push({ angle: 'zapadá', time: s });
      }
      for (const ev of events) {
        for (const pb of BODIES) {
          const pinfo = hourAngleInfo(pb, ev.time);
          for (const h of angleHits(pinfo, ORB_PARAN)) st.parans.push({ starAngle: ev.angle, planet: pb, planetAngle: h.angle, orb: h.orb, time: ev.time.date });
        }
      }
    }
    const LIGHTS = ['Sun', 'Moon'];
    for (const st of stars) {
      st.strength = 0;
      if (st.conj.length) st.strength += 3;
      if (st.angles.length) st.strength += 3;
      for (const p of st.parans) st.strength += LIGHTS.includes(p.planet) ? 2 : 1;
      st.mine = st.conj.length > 0 || st.angles.length > 0 || st.parans.some(p => LIGHTS.includes(p.planet));
    }
    return { profile, date, points, cusps, ang, stars, sunSign: signOf(pos.Sun.lon), moonSign: signOf(pos.Moon.lon) };
  }

  // ---------- kořeny / hledání okamžiků ----------
  function bisect(fn, t0, t1, iters = 30) {
    let a = t0, b = t1, fa = fn(a);
    for (let i = 0; i < iters; i++) {
      const m = (a + b) / 2, fm = fn(m);
      if ((fa < 0) === (fm < 0)) { a = m; fa = fm; } else b = m;
      if (b - a < 1000) break;
    }
    return (a + b) / 2;
  }

  // hodinová mřížka poloh pro interval [t0,t1] (ms) – sdílená pro VoC, aspekty Luny, ingresy
  function hourGrid(t0ms, t1ms, bodies, stepH = 1) {
    const rows = [];
    const step = stepH * 3600000;
    for (let ms = t0ms; ms <= t1ms + 1; ms += step) {
      const t = T(new Date(ms));
      const r = { ms };
      for (const b of bodies) r[b] = lonOf(b, t);
      rows.push(r);
    }
    return rows;
  }

  // přesné aspekty Luny k cílům (konstanty nebo funkce času) v intervalu
  // targets: [{key, lon:number | fn(ms)->lon, aspects?:[keys]}]
  function moonAspectEvents(grid, targets, aspectKeys) {
    const out = [];
    const aspects = ASPECTS.filter(a => !aspectKeys || aspectKeys.includes(a.key));
    for (const tg of targets) {
      const tl = (ms, row) => typeof tg.lon === 'function' ? tg.lon(ms, row) : tg.lon;
      for (const asp of aspects) {
        const angles = asp.angle === 0 || asp.angle === 180 ? [asp.angle] : [asp.angle, -asp.angle];
        for (const ang of angles) {
          const f = (ms, row) => diff(row ? row.Moon : lonOf('Moon', T(new Date(ms))), tl(ms, row) + ang);
          for (let i = 1; i < grid.length; i++) {
            const fa = f(grid[i - 1].ms, grid[i - 1]), fb = f(grid[i].ms, grid[i]);
            if (Math.abs(fa) < 90 && Math.abs(fb) < 90 && (fa < 0) !== (fb < 0) && fa <= 0) {
              // Luna se pohybuje dopředu: crossing z negativního na pozitivní
              const ms = bisect((x) => f(x, null), grid[i - 1].ms, grid[i].ms);
              out.push({ ms, target: tg.key, aspect: asp.key, glyph: asp.glyph, cz: asp.cz, kind: asp.kind });
            }
          }
        }
      }
    }
    out.sort((a, b) => a.ms - b.ms);
    return out;
  }

  // ingresy (změna znamení) těles v mřížce
  function ingressEvents(grid, bodies) {
    const out = [];
    for (const b of bodies) {
      for (let i = 1; i < grid.length; i++) {
        const s0 = signOf(grid[i - 1][b]), s1 = signOf(grid[i][b]);
        if (s0 !== s1) {
          const target = s1 === (s0 + 1) % 12 ? s1 * 30 : s0 * 30; // dopředu nebo (retro) zpět
          const ms = bisect((x) => diff(lonOf(b, T(new Date(x))), target), grid[i - 1].ms, grid[i].ms);
          out.push({ ms, body: b, from: s0, to: s1, retro: s1 !== (s0 + 1) % 12 });
        }
      }
    }
    out.sort((a, b) => a.ms - b.ms);
    return out;
  }

  // měsíční kontext: mřížka, ingresy Luny, aspekty Luny k planetám, VoC
  const _ctxCache = {};
  function monthContext(y, m, tz) {
    const key = `${y}-${m}`;
    if (_ctxCache[key]) return _ctxCache[key];
    const t0 = dayStart(y, m, 1, tz).getTime() - 3 * 86400000;
    const t1 = dayStart(y, m, daysInMonth(y, m), tz).getTime() + 4 * 86400000;
    const grid = hourGrid(t0, t1, BODIES);
    const moonIngress = ingressEvents(grid, ['Moon']);
    const planetTargets = PLANETS_NO_MOON.map(b => ({ key: b, lon: (ms, row) => row ? row[b] : lonOf(b, T(new Date(ms))) }));
    const moonAspects = moonAspectEvents(grid, planetTargets);
    // VoC: od posledního aspektu v každém úseku znamení po ingres
    const voc = [];
    for (const ing of moonIngress) {
      const last = moonAspects.filter(a => a.ms < ing.ms).pop();
      const prevIng = moonIngress.filter(x => x.ms < ing.ms).pop();
      const from = last && (!prevIng || last.ms > prevIng.ms) ? last.ms : (prevIng ? prevIng.ms : null);
      if (from != null) voc.push({ from, to: ing.ms, lastAspect: last && (!prevIng || last.ms > prevIng.ms) ? last : null, toSign: ing.to });
    }
    const ctx = { y, m, grid, moonIngress, moonAspects, voc, t0, t1 };
    _ctxCache[key] = ctx;
    return ctx;
  }

  // ---------- Luna: fáze, lunární den ----------
  function moonQuartersBetween(d0, d1) {
    const out = [];
    let mq = A.SearchMoonQuarter(T(d0));
    while (mq && mq.time.date < d1) {
      out.push({ quarter: mq.quarter, date: mq.time.date });
      mq = A.NextMoonQuarter(mq);
    }
    return out;
  }
  function lastNewMoonBefore(date) {
    let t = A.SearchMoonPhase(0, T(addDays(date, -31)), 33);
    let found = t;
    while (t && t.date <= date) { found = t; t = A.SearchMoonPhase(0, T(addDays(t.date, 1)), 33); }
    return found ? found.date : null;
  }
  function lunarDay(date, observer) {
    const nm = lastNewMoonBefore(date);
    if (!nm) return null;
    let count = 1, t = T(nm), rises = [];
    for (let i = 0; i < 32; i++) {
      const r = A.SearchRiseSet('Moon', observer, +1, t, 2);
      if (!r || r.date > date) break;
      count++; rises.push(r.date); t = T(new Date(r.date.getTime() + 60000));
    }
    return { day: count, since: rises.length ? rises[rises.length - 1] : nm, newMoon: nm };
  }

  // ---------- planetární hodiny ----------
  function planetaryHours(y, m, d, observer, tz) {
    const ds = dayStart(y, m, d, tz);
    const sr = A.SearchRiseSet('Sun', observer, +1, T(ds), 1);
    const ss = A.SearchRiseSet('Sun', observer, -1, T(ds), 1);
    if (!sr || !ss) return null;
    const nextSr = A.SearchRiseSet('Sun', observer, +1, T(new Date(sr.date.getTime() + 60000)), 2);
    const sunrise = sr.date, sunset = ss.date, nextSunrise = nextSr.date;
    const wd = tzParts(sunrise, tz).wd;
    const ruler = DAY_RULER[wd];
    let idx = CHALDEAN.indexOf(ruler);
    const hours = [];
    const dayLen = (sunset - sunrise) / 12, nightLen = (nextSunrise - sunset) / 12;
    for (let i = 0; i < 24; i++) {
      const start = i < 12 ? new Date(sunrise.getTime() + i * dayLen) : new Date(sunset.getTime() + (i - 12) * nightLen);
      const end = i < 12 ? new Date(sunrise.getTime() + (i + 1) * dayLen) : new Date(sunset.getTime() + (i - 11) * nightLen);
      hours.push({ n: i + 1, ruler: CHALDEAN[(idx + i) % 7], start, end, night: i >= 12 });
    }
    return { sunrise, sunset, nextSunrise, ruler, hours };
  }

  // ---------- skóre dne ----------
  const DEFAULT_RULES = {
    orbs: { default: 3, sextile: 2 },
    pointWeight: { Sun: 2, Moon: 2, Asc: 2, MC: 2, default: 1 },
    aspectWeight: { trine: 1, sextile: 0.5, square: -1, opposition: -1 },
    conjWeight: { Sun: 1, Moon: 0.5, Mercury: 0, Venus: 1, Mars: -1, Jupiter: 1, Saturn: -1, Uranus: -0.5, Neptune: -0.5, Pluto: -1 },
    moonAspect: 0.25, moonCap: 1,
    moonElement: 0.5,
    vocPenalty: -1, vocHours: 6,
    mercuryRetro: -0.5,
    kp: { calm: 0.5, g1: -1, g2: -2 },
    thresholds: { harm: 2, tense: -2 },
    starOrb: 1, starOrbPhase: 2,
  };

  function dayAnalysis(y, m, d, natal, observer, tz, kpForDay, rules) {
    rules = rules || DEFAULT_RULES;
    const ds = dayStart(y, m, d, tz);
    const dayEnd = (() => { const p = tzParts(addDays(ds, 1.5), tz); return dayStart(p.y, p.m, p.d, tz); })();
    const noon = new Date(ds.getTime() + (dayEnd.getTime() - ds.getTime()) / 2);
    const pos = positions(noon);
    const reasons = [];
    let score = 0, backgroundScore = 0;
    const SLOW = ['Jupiter', 'Saturn', 'Uranus', 'Neptune', 'Pluto'];
    const W = (k) => rules.pointWeight[k] != null ? rules.pointWeight[k] : rules.pointWeight.default;
    const NATAL_KEYS = ['Sun', 'Moon', 'Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune', 'Pluto', 'Asc', 'MC'];

    // tranzity (bez Luny) v poledne
    const transits = [];
    for (const tb of PLANETS_NO_MOON) {
      for (const nk of NATAL_KEYS) {
        const asp = aspectBetween(pos[tb].lon, natal.points[nk].lon, rules.orbs);
        if (!asp) continue;
        const pos2 = lonOf(tb, T(new Date(noon.getTime() + 86400000)));
        const orbNext = Math.abs(Math.abs(diff(pos2, natal.points[nk].lon)) - asp.angle);
        const applying = orbNext < asp.orb;
        let w = asp.key === 'conj' ? rules.conjWeight[tb] : rules.aspectWeight[asp.key];
        w = w * W(nk) * (asp.orb <= 1.5 ? 1 : 0.5);
        const slow = SLOW.includes(tb);
        transits.push({ transit: tb, natal: nk, ...asp, applying, weight: w, retro: pos[tb].retro, slow });
        if (slow) backgroundScore += w; else score += w;
      }
    }
    transits.sort((a, b) => a.orb - b.orb);
    const background = transits.filter(t => t.slow), fast = transits.filter(t => !t.slow);

    // Luna: přesné aspekty k nativu během dne
    const ctx = monthContext(y, m, tz);
    const grid = ctx.grid.filter(r => r.ms >= ds.getTime() - 3600000 && r.ms <= dayEnd.getTime() + 3600000);
    const natalTargets = NATAL_KEYS.map(k => ({ key: k, lon: natal.points[k].lon }));
    const moonToNatal = moonAspectEvents(grid, natalTargets).filter(e => e.ms >= ds.getTime() && e.ms < dayEnd.getTime());
    let moonScore = 0;
    for (const e of moonToNatal) {
      const h = tzParts(new Date(e.ms), tz).hh;
      const awake = h >= 6 && h < 23;
      let w = e.kind === 'harm' ? rules.moonAspect : e.kind === 'tense' ? -rules.moonAspect : (e.target === 'Sun' || e.target === 'Moon' ? rules.moonAspect : 0);
      if (!awake) w *= 0.5;
      e.weight = w; moonScore += w;
    }
    moonScore = Math.max(-rules.moonCap, Math.min(rules.moonCap, moonScore));
    score += moonScore;

    // Luna: znamení, živel, fáze
    const moonSign = signOf(pos.Moon.lon);
    const moonEl = ELEMENT[moonSign], sunEl = ELEMENT[natal.sunSign];
    const elementHarmony = FRIENDLY[sunEl].includes(moonEl);
    if (elementHarmony) { score += rules.moonElement; reasons.push({ kind: 'harm', text: `Luna v ${SIGN_LOC[moonSign]} – živel ${moonEl} ladí s tvým Sluncem (${sunEl})`, w: rules.moonElement }); }
    const phaseAngle = A.MoonPhase(T(noon));
    const illum = A.Illumination('Moon', T(noon)).phase_fraction;

    // VoC v rámci dne
    const vocToday = ctx.voc.filter(v => v.to > ds.getTime() && v.from < dayEnd.getTime()).map(v => ({ ...v, fromClip: Math.max(v.from, ds.getTime()), toClip: Math.min(v.to, dayEnd.getTime()) }));
    let vocAwake = 0;
    for (const v of vocToday) {
      const a = Math.max(v.fromClip, ds.getTime() + 8 * 3600000), b = Math.min(v.toClip, ds.getTime() + 22 * 3600000);
      if (b > a) vocAwake += (b - a) / 3600000;
    }
    if (vocAwake >= rules.vocHours) { score += rules.vocPenalty; reasons.push({ kind: 'tense', text: `Luna bez kurzu ${Math.round(vocAwake)} h z aktivní části dne`, w: rules.vocPenalty }); }

    // Merkur retro

  };
  // --- Luna ve znamení: krátká charakteristika ---

  const GO = {

    Sun: 'směr a sebevědomí', Moon: 'pocity a klid', Mercury: 'myšlení a domluvy',

    Saturn: 'práce a závazky', Uranus: 'svoboda a změny', Neptune: 'intuice a sny',

  function dayLede(da, ctxEvents) {

      else if (big.quarter === 0) s += ' Novoluní: dobrý den vyslovit záměr, ne ho hned tlačit.';

    for (const e of da.moonToNatal) {

      at(e.ms, e.kind === 'harm' ? '✦' : e.kind === 'tense' ? '△' : '○', t, n, e.kind);

      if (v.fromClip > da.dayStart.getTime()) at(v.fromClip, '∅', 'Luna bez kurzu', `až do ${v.toClip >= da.dayEnd.getTime() ? 'půlnoci' : K.fmtTime(new Date(v.toClip), tz)} nic nového nezačínej — dokončování a odpočinek jdou naopak dobře`, 'tense');

    }

  function moonSVG(phase, size, cls) {
    const r = size / 2 - 0.6, p = phase * Math.PI / 180;
    const f = (1 - Math.cos(p)) / 2, wax = phase < 180, rx = Math.abs(Math.cos(p)) * r, big = f > 0.5;
    const d = wax ? `M0,${-r} A${r},${r} 0 0 1 0,${r} A${rx},${r} 0 0 ${big ? 1 : 0} 0,${-r}Z` : `M0,${-r} A${r},${r} 0 0 0 0,${r} A${rx},${r} 0 0 ${big ? 0 : 1} 0,${-r}Z`;
    return `<svg class="${cls || 'moon'}" viewBox="${-size / 2} ${-size / 2} ${size} ${size}" width="${size}" height="${size}" aria-hidden="true"><circle r="${r}" fill="var(--moon-dark)" stroke="var(--line2)" stroke-width=".6"/><path d="${d}" fill="var(--moon)"/></svg>`;
  }

  // ===================== NOAA =====================
  async function fetchText(url, key) {
    try { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return await r.text(); }
    catch (e) { const r2 = await fetch('/api/noaa?src=' + key, { cache: 'no-store' }); if (!r2.ok) throw new Error('NOAA nedostupné'); return await r2.text(); }
  }
  async function loadKp(force) {
    const cached = store.get('kairos_kp', null);
    if (cached && cached.map && cached.updated && !force && Date.now() - cached.updated < 3 * 3600000) { S.kpMap = cached.map; S.kpUpdated = cached.updated; return; }
    if (cached && cached.map) { S.kpMap = cached.map; S.kpUpdated = cached.updated; }
    if (!navigator.onLine && !force) return;
    try {
      const [obs, fc, out] = await Promise.all([fetchText(NOAA.kpObs, 'kp').then(t => K.parseKpJson(JSON.parse(t))).catch(() => []), fetchText(NOAA.kpFc, 'kpf').then(t => K.parseKpJson(JSON.parse(t))).catch(() => []), fetchText(NOAA.outlook, 'outlook').then(t => K.parseOutlook(t)).catch(() => [])]);
      if (!obs.length && !fc.length && !out.length) throw new Error('prázdná odpověď');
      S.kpMap = K.mergeKp(obs, fc, out, TZ); S.kpUpdated = Date.now(); S.kpError = null;
      store.set('kairos_kp', { map: S.kpMap, updated: S.kpUpdated });
      S.dayCache = {};
      if (S.tab === 'kalendar') renderCalendar();
      if (S.tab === 'nastaveni') renderSettings();
    } catch (e) { S.kpError = 'Data NOAA se nepodařilo stáhnout (' + (e.message || e) + ').'; if (S.tab === 'nastaveni') renderSettings(); }
  }

  // ===================== analýza dne (cache) =====================
  function analyze(y, m, d) {
    const key = `${activeId}|${y}-${m}-${d}|${S.kpUpdated}|${JSON.stringify(settings.rules)}|${settings.loc.lat},${settings.loc.lon}`;
    if (S.dayCache[key]) return S.dayCache[key];
    const kp = settings.showKp ? S.kpMap[K.isoDate(y, m, d)] || null : null;
    const da = K.dayAnalysis(y, m, d, S.natal, observer(), TZ, kp, rules());
    S.dayCache[key] = da;
    return da;
  }
  function monthEvents(y, m) {
    const key = `m|${activeId}|${y}-${m}|${settings.loc.lat},${settings.loc.lon}`;
    if (S.evCache[key]) return S.evCache[key];
    const d0 = K.dayStart(y, m, 1, TZ), d1 = K.addDays(K.dayStart(y, m, K.daysInMonth(y, m), TZ), 1);
    const ev = K.skyEvents(d0, d1, observer(), S.natal, TZ).concat(cometEvents(d0, d1));
    S.evCache[key] = ev; return ev;
  }
  function cometEvents(d0, d1) {
    const out = [];
    for (const line of String(settings.comets || '').split('\n')) {
      const mt = line.match(/^\s*(\d{4})-(\d{1,2})-(\d{1,2})\s*\|\s*([^|]+?)\s*(?:\|\s*(.*))?$/);
      if (!mt) continue;
      const date = K.localToDate(+mt[1], +mt[2], +mt[3], 21, 0, TZ);
      if (date >= d0 && date < d1) out.push({ date, cat: 'komety', title: mt[4], note: mt[5] || '', custom: true });
    }
    return out;
  }

  // ===================== KALENDÁŘ =====================
  function renderCalendar() {
    const v = $('#view-kalendar');
    if (!S.natal) { v.innerHTML = '<div class="card">Nejdřív zadej datum, čas a místo narození v Nastavení.</div>'; return; }
    const { y, m } = S;
    const n = K.daysInMonth(y, m);
    const offset = (K.tzParts(K.dayStart(y, m, 1, TZ), TZ).wd + 6) % 7;
    const evs = monthEvents(y, m);
    const evByDay = {};
    for (const e of evs) { const k = K.dateKey(e.date, TZ); (evByDay[k] = evByDay[k] || []).push(e); }
    let cells = '';
    for (let i = 0; i < offset; i++) cells += '<div class="cell empty"></div>';
    for (let d = 1; d <= n; d++) {
      const da = analyze(y, m, d);
      const key = K.isoDate(y, m, d);
      const dayEv = evByDay[key] || [];
      const alpha = Math.min(0.46, 0.14 + Math.abs(da.score) / 6 * 0.32).toFixed(2);
      const isToday = key === TODAY_KEY, isSel = S.sel.y === y && S.sel.m === m && S.sel.d === d;
      // jen jedna značka: to nejvýraznější, co ten den je
      let mk = '';
      const q = da.quarters.find(q => q.quarter === 0 || q.quarter === 2);
      if (dayEv.some(e => e.eclipse)) mk = '<span class="ec" title="zatmění">◉</span>';
      else if (da.resonance.length || dayEv.some(e => e.resonance)) mk = '<span title="tvá hvězda">✦</span>';
      else if (q) mk = `<span title="${q.quarter === 0 ? 'novoluní' : 'úplněk'}">${q.quarter === 0 ? '●' : '○'}</span>`;
      else if (da.kp && da.kp.kp >= 5) mk = '<span class="kp" title="geomagnetická bouře">⚡</span>';
      const hasJ = !!jGet(key);
      const hasP = pGet(key).length > 0;
      cells += `<button type="button" class="cell ${da.color} ${isToday ? 'today' : ''} ${isSel ? 'sel' : ''} ${hasJ ? 'noted' : ''} ${hasP ? 'planned' : ''}" style="--a:${alpha}" data-act="selDay" data-y="${y}" data-m="${m}" data-d="${d}" aria-label="${d}. ${K.MONTH_GEN[m - 1]} — ${TX.dayWord(da)}">
        <span class="d">${d}</span><span class="mk">${mk}</span>${moonSVG(da.phaseAngle, 12)}
      </button>`;
    }
    v.innerHTML = `
      ${aheadHTML()}
      <div class="monthbar">
        <button class="navbtn" data-act="prevMonth" aria-label="Předchozí měsíc">‹</button>
        <div class="mn">${K.MONTH_CZ[m - 1].charAt(0).toUpperCase() + K.MONTH_CZ[m - 1].slice(1)}<em>${y}</em></div>
        <div class="row"><button type="button" class="btn ghost small" data-act="today">Dnes</button><button class="navbtn" data-act="nextMonth" aria-label="Další měsíc">›</button></div>
      </div>
      <div class="weekdays"><span>Po</span><span>Út</span><span>St</span><span>Čt</span><span>Pá</span><span>So</span><span>Ne</span></div>
      <div class="grid">${cells}</div>
      <div class="legend"><span><i style="background:var(--harm)"></i>jde to snáz</span><span><i style="background:var(--tense)"></i>stojí to víc sil</span><span>✦ tvá hvězda</span><span>◉ zatmění</span><span>● ○ novoluní / úplněk</span></div>
      <div class="day" id="dayDetail">${dayDetailHTML(S.sel.y, S.sel.m, S.sel.d, evByDay)}</div>`;
  }

  // pás nejbližších dnů
  function aheadHTML() {
    let out = '';
    for (let i = 0; i < 14; i++) {
      const dt = K.addDays(K.dayStart(np.y, np.m, np.d, TZ), i + 0.5);
      const p = K.tzParts(dt, TZ);
      const da = analyze(p.y, p.m, p.d);
      const key = K.isoDate(p.y, p.m, p.d);
      const sel = S.sel.y === p.y && S.sel.m === p.m && S.sel.d === p.d;
      out += `<button class="a ${da.color} ${key === TODAY_KEY ? 'today' : ''} ${sel ? 'sel' : ''}" data-act="selDay" data-y="${p.y}" data-m="${p.m}" data-d="${p.d}">
        <span class="wd">${i === 0 ? 'dnes' : K.WEEKDAY_CZ[p.wd].slice(0, 2)}</span><span class="dd">${p.d}</span><span class="wo">${TX.dayWord(da)}</span></button>`;
    }
    return `<div class="h3" style="margin-top:14px">Nejbližší dny</div><div class="ahead">${out}</div>`;
  }

  function dayDetailHTML(y, m, d, evByDay) {
    const da = analyze(y, m, d);
    const obs = observer();
    const ph = K.planetaryHours(y, m, d, obs, TZ);
    const pp = K.tzParts(K.addDays(da.dayStart, -0.5), TZ);
    const phPrev = K.planetaryHours(pp.y, pp.m, pp.d, obs, TZ);
    const ld = K.lunarDay(da.noon, obs);
    const key = K.isoDate(y, m, d);
    const dayEv = (evByDay && evByDay[key]) || monthEvents(y, m).filter(e => K.dateKey(e.date, TZ) === key);
    const isToday = key === TODAY_KEY;
    const moonrise = A.SearchRiseSet('Moon', obs, +1, A.MakeTime(da.dayStart), 1), moonset = A.SearchRiseSet('Moon', obs, -1, A.MakeTime(da.dayStart), 1);

    const gen = TX.generalItems(da, dayEv, rules());
    const per = TX.personalItems(da, rules());
    const wins = TX.windows(da, ph, TZ);
    const bullet = (it) => `<li class="${it.star ? 'mine' : ''}"><span>${esc(it.text)}${it.tag ? `<span class="tag">${it.tag}</span>` : ''}${it.note ? `<span class="n">${esc(it.note)}</span>` : ''}</span></li>`;
    const go = gen.go.concat(per.go), cost = gen.cost.concat(per.cost);

    return `
      <div class="day-head">
        <div class="day-title"><small>${isToday ? 'dnes · ' : ''}${K.WEEKDAY_CZ[K.tzParts(da.noon, TZ).wd]}</small>${d}. ${K.MONTH_GEN[m - 1]} ${y}</div>
        <div><span class="badge ${da.color}">${TX.dayWord(da)}</span></div>
      </div>
      <p class="lede">${esc(TX.dayLede(da, dayEv))}</p>
      ${planPanel(K.isoDate(y, m, d))}
      <div class="panel go"><h4>Co dnes jde</h4><ul>${go.map(bullet).join('')}</ul></div>
      ${cost.length ? `<div class="panel cost"><h4>Co bude stát víc sil</h4><ul>${cost.map(bullet).join('')}</ul></div>` : ''}
      <div class="h3">Průběh dne</div>
      ${timelineHTML(da, ph, wins, ld, moonrise, moonset, dayEv, isToday)}
      ${journalPanel(K.isoDate(y, m, d), da)}
      <details><summary>Podrobnosti — pro astrologa</summary>
        <div class="h3">Pás dne</div>
        ${stripHTML(da, ph, phPrev, isToday, moonrise, moonset)}
        <div class="striplegend"><span>▮ denní světlo</span><span>▨ Luna bez kurzu</span><span>spodní pás = planetární hodiny, barva = vládnoucí planeta</span>${isToday ? '<span style="color:var(--gold)">│ teď</span>' : ''}</div>
        <p class="note">Skóre dne ${signed(da.score)} · práh ${signed(rules().thresholds.harm)} / ${signed(rules().thresholds.tense)}.</p>
        <div class="h3">Tranzity k nativu</div>
        ${da.fast.length ? `<ul class="list">${da.fast.map(transitItem).map(li).join('')}</ul>` : '<p class="muted small">Žádné v orbisu.</p>'}
        ${da.background.length ? `<div class="h3">Pozadí období · pomalé planety</div><ul class="list">${da.background.map(transitItem).map(li).join('')}</ul><p class="note">Trvají týdny až měsíce, barvu dne neurčují (součet ${signed(da.backgroundScore)}).</p>` : ''}
        ${da.moonToNatal.length ? `<div class="h3">Aspekty Luny</div><ul class="list">${da.moonToNatal.map(e => li({ g: '☽', cls: e.kind === 'harm' ? 'tone-harm' : e.kind === 'tense' ? 'tone-tense' : '', text: `Luna ${e.glyph} ${NATAL_ACC[e.target]}`, note: K.fmtTime(new Date(e.ms), TZ), w: e.weight ? signed(e.weight) : '' })).join('')}</ul>` : ''}
        <div class="h3">Luna</div>
        <p class="small">${TX.phaseText(da.phaseAngle).name} · ${Math.round(da.illum * 100)} % · ${K.fmtLon(da.pos.Moon.lon)}${ld ? ` · ${ld.day}. lunární den od ${K.fmtTime(ld.since, TZ)}` : ''}${moonrise ? ` · východ ${K.fmtTime(moonrise.date, TZ)}` : ''}${moonset ? ` · západ ${K.fmtTime(moonset.date, TZ)}` : ''}</p>
        ${ph ? `<div class="h3">Planetární hodiny</div><p class="small">východ Slunce <b class="mono">${K.fmtTime(ph.sunrise, TZ)}</b> · západ <b class="mono">${K.fmtTime(ph.sunset, TZ)}</b> · vládce dne ${K.BODY_GLYPH[ph.ruler]} ${K.BODY_CZ[ph.ruler]}</p>
        <div class="ph-table">${ph.hours.map(h => `<div class="${isToday && Date.now() >= h.start.getTime() && Date.now() < h.end.getTime() ? 'cur' : ''}"><span>${K.BODY_GLYPH[h.ruler]} ${K.BODY_CZ[h.ruler]}${h.night ? ' ·noc' : ''}</span><span>${K.fmtTime(h.start, TZ)}–${K.fmtTime(h.end, TZ)}</span></div>`).join('')}</div>` : ''}
        <div class="h3">Planety v poledne</div>
        <p class="small mono">${K.BODIES.map(b => `${K.BODY_GLYPH[b]} ${K.fmtLon(da.pos[b].lon)}${da.pos[b].retro ? '<span class="tone-tense">R</span>' : ''}`).join(' &nbsp; ')} &nbsp; ☊ ${K.fmtLon(da.pos.Node.lon)}</p>
      </details>
      <p class="note">Nic z toho není předpověď ani pokyn. Je to mapa terénu — kudy dnes půjde snáz a kde budeš potřebovat víc trpělivosti. Rozhoduješ pořád ty.</p>`;
  }

  function planPanel(key) {
    const items = pGet(key);
    const list = items.map(it => `<li><span class="pt">${it.t ? esc(it.t) : '—'}</span><span class="pn">${esc(it.name)}</span>
      <button type="button" class="px" data-act="delPlan" data-k="${key}" data-id="${it.id}" aria-label="Smazat">×</button></li>`).join('');
    return `<div class="panel pl">
      <h4>Co mě čeká</h4>
      ${items.length ? `<ul class="plist">${list}</ul>` : '<p class="small muted" style="margin:0 0 8px">Zatím nic zapsaného.</p>'}
      <div class="planadd">
        <input type="time" name="ptime" aria-label="Čas">
        <input type="text" name="pname" placeholder="Schůzka, zubař, cesta…" aria-label="Co">
        <button type="button" class="btn small" data-act="addPlan" data-k="${key}">Přidat</button>
      </div>
    </div>`;
  }

  function journalPanel(key, da) {
    const e = jGet(key) || {};
    const chips = RATES.map(r => `<button type="button" class="rate ${r.cls} ${e.rate === r.v ? 'on' : ''}" data-act="rate" data-k="${key}" data-v="${r.v}">${r.label}</button>`).join('');
    return `<div class="panel jr">
      <h4>Zápis dne</h4>
      <div class="rates">${chips}</div>
      <textarea id="jNote" class="jnote" data-k="${key}" rows="3" placeholder="Jak dnešek šel? Co se stalo, jak ti bylo, co vyšlo a co ne.">${esc(e.note || '')}</textarea>
      <div class="row" style="justify-content:space-between;margin-top:6px">
        <button type="button" class="btn ghost small" data-act="saveNote">Zapsat</button>
        <span class="small muted">appka na dnes říká „${TX.dayWord(da)}“</span>
      </div>
    </div>`;
  }

  function renderJournal() {
    const v = $('#view-diar');
    const jk = Object.keys(journal), pk = Object.keys(plan);
    const keys = [...new Set([...jk, ...pk])].sort().reverse();
    if (!keys.length) {
      v.innerHTML = `<div class="h2">Diář</div>
        <div class="card"><p>Zatím tu nic není. Otevři si den v kalendáři — nahoře u něj zapíšeš, co tě čeká (schůzka, cesta, zubař…), a dole večer jedním klikem, jak den šel.</p>
        <p class="note">Po nějaké době se tady ukáže, jak moc se tvoje hodnocení potkává s tím, co appka spočítala. To je jediný způsob, jak zjistit, jestli ti barvení dnů skutečně sedí.</p></div>
        ${journalIO()}`;
      return;
    }
    // shoda hodnocení se spočítaným skóre
    const rated = keys.filter(k => { const e = jGet(k); return e && e.rate != null; });
    let stat = '';
    if (rated.length >= 5) {
      let n = 0, agree = 0, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0;
      for (const k of rated) {
        const [y, m, d] = k.split('-').map(Number);
        const da = analyze(y, m, d), r = jGet(k).rate;
        const sc = da.score;
        if ((r > 0 && sc > 0) || (r < 0 && sc < 0) || (r === 0 && Math.abs(sc) < 2)) agree++;
        n++; sx += r; sy += sc; sxx += r * r; syy += sc * sc; sxy += r * sc;
      }
      const den = Math.sqrt(n * sxx - sx * sx) * Math.sqrt(n * syy - sy * sy);
      const corr = den > 0 ? (n * sxy - sx * sy) / den : 0;
      const pct = Math.round(agree / n * 100);
      const slovo = corr > 0.5 ? 'silná' : corr > 0.25 ? 'zřetelná' : corr > 0.05 ? 'slabá' : corr > -0.05 ? 'žádná' : 'obrácená';
      stat = `<div class="card"><div class="h3" style="margin-top:0">Jak to sedí</div>
        <p><b>${pct} %</b> dnů se shoduje ve směru · souvislost <b>${slovo}</b> (r = ${fmtNum(corr, 2).replace('.', ',')})</p>
        <p class="note">Počítáno z ${n} ohodnocených dnů. Pod dvacet dnů je to jen orientační — na náhodě se dá snadno vidět vzorec, který tam není. Kdyby souvislost zůstala žádná i po dvou měsících, znamená to, že váhy v Nastavení potřebují přeladit, nebo že tenhle způsob barvení dnů pro tebe nefunguje.</p></div>`;
    } else {
      stat = `<p class="note">Na porovnání s výpočtem je potřeba aspoň pět ohodnocených dnů. Máš ${rated.length}.</p>`;
    }
    let html = `<div class="h2">Diář</div><p class="note">${keys.length} ${keys.length === 1 ? 'zápis' : keys.length < 5 ? 'zápisy' : 'zápisů'} · vše zůstává jen v tomto zařízení</p>${stat}`;
    let curMonth = '';
    for (const k of keys) {
      const [y, m, d] = k.split('-').map(Number);
      const mk = `${y}-${m}`;
      if (mk !== curMonth) { curMonth = mk; html += `<div class="ev-month">${K.MONTH_CZ[m - 1].charAt(0).toUpperCase() + K.MONTH_CZ[m - 1].slice(1)} ${y}</div>`; }
      const e = jGet(k) || {}, da = analyze(y, m, d);
      const r = RATES.find(x => x.v === e.rate);
      const pls = pGet(k);
      const plHtml = pls.length ? `<span class="jc" style="color:var(--gold)">${pls.map(x => (x.t ? x.t + ' ' : '') + esc(x.name)).join(' · ')}</span>` : '';
      const p = K.tzParts(K.dayStart(y, m, d, TZ), TZ);
      html += `<button type="button" class="jitem ${da.color}" data-act="jumpDay" data-y="${y}" data-m="${m}" data-d="${d}">
        <span class="jd"><b>${d}.</b>${K.WEEKDAY_CZ[p.wd].slice(0, 2)}</span>
        <span class="jt">${r ? `<span class="badge ${r.cls}">${r.label}</span>` : ''}${plHtml}${e.note ? `<span class="jc">${esc(e.note)}</span>` : ''}
        <span class="n">appka: ${TX.dayWord(da)}${r && ((r.v > 0 && da.color === 'tense') || (r.v < 0 && da.color === 'harm')) ? ' · rozchází se' : ''}</span></span></button>`;
    }
    v.innerHTML = html + journalIO();
  }
  function journalIO() {
    return `<div class="h3">Záloha</div><div class="card">
      <div class="row"><button type="button" class="btn" data-act="exportJournal">Uložit zálohu (JSON)</button><button type="button" class="btn ghost" data-act="exportJournalCsv">Export do tabulky (CSV)</button><button type="button" class="btn ghost" data-act="importJournal">Načíst zálohu</button></div>
      <input type="file" id="jFile" accept="application/json" style="display:none">
      <p class="note">Zápisy jsou uložené jen v tomto prohlížeči. Když vymažeš data prohlížeče nebo odinstaluješ appku, zmizí. Dělej si zálohu — tohle je jediná věc v appce, která se nedá znovu spočítat.</p></div>`;
  }

  function timelineHTML(da, ph, wins, ld, moonrise, moonset, dayEv, isToday) {
    const E = TX.timeline(da, ph, wins, ld, moonrise, moonset, dayEv, TZ);
    const key = K.isoDate(da.y, da.m, da.d);
    const mine = pGet(key);
    for (const it of mine) if (it.t) E.push({ ms: planMs(key, it.t), icon: '◆', text: it.name, note: nearbyNote(planMs(key, it.t), da, wins), kind: 'mine', mine: true });
    E.sort((a, b) => a.ms - b.ms);
    const untimed = mine.filter(it => !it.t);
    if (!E.length) return '<p class="muted small">Dnes se na obloze nic výrazného neděje.</p>';
    const nowMs = Date.now();
    let nextIdx = -1;
    if (isToday) { for (let i = 0; i < E.length; i++) if (E[i].ms >= nowMs) { nextIdx = i; break; } }
    return `<div class="tl">${E.map((e, i) => `<div class="e ${e.kind} ${i === nextIdx ? 'now' : ''}">
      <span class="t">${K.fmtTime(new Date(e.ms), TZ)}</span><span class="dot">${e.icon}</span>
      <span class="x">${esc(e.text)}${e.note ? `<span class="n">${esc(e.note)}</span>` : ''}</span></div>`).join('')}</div>
      ${untimed.length ? `<p class="note">Bez času: ${untimed.map(x => esc(x.name)).join(' · ')}</p>` : ''}
      ${isToday && nextIdx > 0 ? '<p class="note">Zvýrazněné je nejbližší, co tě dnes čeká.</p>' : ''}`;
  }

  // co leží blízko naplánovaného času – kvůli tomu ten plán v ose je
  function nearbyNote(ms, da, wins) {
    const bits = [];
    for (const w of wins || []) if (ms >= w.from.getTime() - 60000 && ms < w.to.getTime()) bits.push('padá do okna ' + w.use);
    for (const v of da.voc) if (ms >= v.fromClip && ms < v.toClip) bits.push('Luna bez kurzu — nezačínej tím nic nového');
    for (const e of da.moonToNatal) {
      const d = Math.abs(e.ms - ms);
      if (d <= 75 * 60000) {
        const kdy = e.ms > ms ? 'krátce po' : 'krátce před';
        if (e.kind === 'harm') bits.push(`${kdy} tom vstřícná chvíle (${K.fmtTime(new Date(e.ms), TZ)})`);
        else if (e.kind === 'tense') bits.push(`${kdy} tom citlivější chvíle (${K.fmtTime(new Date(e.ms), TZ)})`);
      }
    }
    const ph = K.planetaryHours(da.y, da.m, da.d, observer(), TZ);
    if (ph) { const h = ph.hours.find(x => ms >= x.start.getTime() && ms < x.end.getTime()); if (h) bits.push('hodina ' + K.BODY_GEN[h.ruler]); }
    return bits.length ? bits.join(' · ') : '';
  }

  function transitItem(t) {
    const cls = t.key === 'conj' ? (t.weight > 0 ? 'tone-harm' : t.weight < 0 ? 'tone-tense' : '') : t.kind === 'harm' ? 'tone-harm' : 'tone-tense';
    const note = (t.key === 'conj' ? CONJ_HINT[t.transit] : t.kind === 'harm' ? 'podpora, plynutí' : 'tření, tlak, nutnost rozhodnout') + ` · orbis ${fmtOrb(t.orb)} · ${t.applying ? 'blíží se' : 'odeznívá'}${t.retro ? ' · retrográdně' : ''}`;
    return { g: K.BODY_GLYPH[t.transit], cls, text: `${K.BODY_CZ[t.transit]} ${t.glyph} ${NATAL_ACC[t.natal]}`, note, w: t.weight ? signed(t.weight) : '' };
  }
  const li = (it) => `<li><span class="g ${it.cls || ''}">${it.g}</span><span class="t"><span class="${it.cls || ''}">${esc(it.text)}</span>${it.note ? `<span class="n">${esc(it.note)}</span>` : ''}</span>${it.w ? `<span class="w">${it.w}</span>` : ''}</li>`;

  function stripHTML(da, ph, phPrev, isToday, moonrise, moonset) {
    const t0 = da.dayStart.getTime(), t1 = da.dayEnd.getTime();
    const pct = (ms) => Math.max(0, Math.min(100, (ms - t0) / (t1 - t0) * 100));
    let h = '<div class="sky"></div>';
    if (ph) h += `<div class="daylight" style="left:${pct(ph.sunrise)}%;width:${pct(ph.sunset) - pct(ph.sunrise)}%"></div>`;
    for (const v of da.voc) h += `<div class="voc" style="left:${pct(v.fromClip)}%;width:${pct(v.toClip) - pct(v.fromClip)}%"></div>`;
    const hours = [].concat(phPrev ? phPrev.hours : [], ph ? ph.hours : []);
    for (const hr of hours) {
      const a = Math.max(hr.start.getTime(), t0), b = Math.min(hr.end.getTime(), t1);
      if (b <= a) continue;
      const nowD = new Date();
      const cur = isToday && nowD >= hr.start && nowD < hr.end;
      h += `<div class="hour ${cur ? 'cur' : ''}" style="left:${pct(a)}%;width:${pct(b) - pct(a)}%;background:${PLANET_COLOR[hr.ruler]};opacity:${hr.night ? .55 : .85}" title="${K.BODY_CZ[hr.ruler]} ${K.fmtTime(hr.start, TZ)}–${K.fmtTime(hr.end, TZ)}"></div>`;
    }
    for (const hh of [0, 6, 12, 18, 24]) h += `<span class="hl" style="left:${hh / 24 * 100}%">${hh}</span>`;
    if (ph) { h += `<span class="sunmark" style="left:${pct(ph.sunrise)}%">☉↑</span><span class="sunmark" style="left:${pct(ph.sunset)}%">☉↓</span>`; }
    if (moonrise) h += `<span class="moonmark" style="left:${pct(moonrise.date)}%">☽↑</span>`;
    if (moonset) h += `<span class="moonmark" style="left:${pct(moonset.date)}%">☽↓</span>`;
    for (const e of da.moonToNatal) h += `<span class="tick ${e.kind}" style="left:${pct(e.ms)}%" title="Luna ${e.cz} ${NATAL_ACC[e.target]} ${K.fmtTime(new Date(e.ms), TZ)}">${e.glyph}<b>${K.BODY_GLYPH[e.target]}</b></span>`;
    for (const r of da.resonance.filter(r => r.ms)) h += `<span class="tick" style="left:${pct(r.ms)}%;color:var(--gold)" title="${esc(r.text)}">✦</span>`;
    if (isToday) h += `<div class="now" style="left:${pct(Date.now())}%"></div>`;
    return `<div class="strip" role="img" aria-label="Pás dne: světlo, planetární hodiny, Luna bez kurzu, aspekty Luny">${h}</div>`;
  }

  // ===================== ÚKAZY =====================
  function renderEvents() {
    const v = $('#view-ukazy');
    if (!S.natal) { v.innerHTML = '<div class="card">Nejdřív vyplň nativ v Nastavení.</div>'; return; }
    v.innerHTML = '<div class="loading">Počítám oblohu na rok dopředu…</div>';
    setTimeout(() => {
      const key = `y|${activeId}|${np.y}-${np.m}|${settings.loc.lat},${settings.loc.lon}|${(settings.comets || '').length}`;
      let evs = S.evCache[key];
      if (!evs) {
        const d0 = K.dayStart(np.y, np.m, 1, TZ);
        const endM = np.m === 12 ? 1 : np.m + 1, endY = np.m === 12 ? np.y + 1 : np.y;
        const d1 = K.dayStart(endY + 1, endM, 1, TZ);
        evs = K.skyEvents(d0, d1, observer(), S.natal, TZ).concat(cometEvents(d0, d1));
        // heliakické východy tvých hvězd
        for (const st of S.natal.stars.filter(s => s.mine || s.strength > 0)) {
          for (const yy of [np.y, np.y + 1]) {
            const hr = K.heliacalRising(st, yy, observer(), TZ);
            if (hr && hr >= d0 && hr < d1) evs.push({ date: new Date(hr.getTime() + 5 * 3600000), cat: 'hvezdy', title: `Heliakický východ – ${st.name}`, note: `první ranní viditelnost (${esc(settings.loc.name)}) po období, kdy hvězdu zakrývalo Slunce · ${st.mine ? 'hlavní' : 'vedlejší'} hvězda tvého nativu`, resonance: st.mine });
          }
        }
        evs.sort((a, b) => a.date - b.date);
        S.evCache[key] = evs;
      }
      const list = S.filter === 'vse' ? evs : evs.filter(e => e.cat === S.filter);
      const months = {};
      for (const e of list) { const p = K.tzParts(e.date, TZ); const k = `${p.y}-${pad(p.m)}`; (months[k] = months[k] || { y: p.y, m: p.m, items: [] }).items.push(e); }
      const chips = ['vse', 'zatmeni', 'luna', 'planety', 'hvezdy', 'roje', 'slunce', 'komety'].map(c => `<button type="button" class="chip ${S.filter === c ? 'on' : ''}" data-act="filter" data-f="${c}">${CAT_CZ[c]}</button>`).join('');
      let html = `<div class="h2">Úkazy · ${esc(settings.loc.name)}</div><p class="note">Rok dopředu od tohoto měsíce. Časy jsou v našem čase, viditelnost počítaná pro ${esc(settings.loc.name)} (${fmtNum(settings.loc.lat, 3)} N, ${fmtNum(settings.loc.lon, 3)} E).</p><div class="row" style="gap:6px">${chips}</div>`;
      const keys = Object.keys(months).sort();
      if (!keys.length) html += '<p class="muted">V této kategorii nic není.</p>';
      for (const k of keys) {
        const mo = months[k];
        html += `<div class="ev-month">${K.MONTH_CZ[mo.m - 1].charAt(0).toUpperCase() + K.MONTH_CZ[mo.m - 1].slice(1)} ${mo.y}</div>`;
        for (const e of mo.items) {
          const p = K.tzParts(e.date, TZ);
          html += `<div class="ev ${e.resonance ? 'res' : ''}"><div class="dt"><b>${p.d}.</b>${e.cat === 'roje' || e.custom || e.cat === 'hvezdy' && e.title.startsWith('Heliak') ? '' : K.fmtTime(e.date, TZ)}</div><div><div class="ti"><span class="c">${CAT_ICON[e.cat] || '✧'}</span>${esc(e.title)}</div>${e.note ? `<div class="no">${esc(e.note)}</div>` : ''}</div></div>`;
        }
      }
      html += `<p class="note" style="margin-top:18px">Komety, novy a podobné jednorázové úkazy se spočítat nedají – přidáš si je v Nastavení (řádek: datum | název | poznámka).</p>`;
      v.innerHTML = html;
    }, 30);
  }

  // ===================== EFEMERIDY =====================
  function ephRows() { return K.ephemerisMonth(S.eph.y, S.eph.m, TZ); }
  function renderEphemeris() {
    const v = $('#ephHost');
    if (!v) return;
    const { y, m } = S.eph;
    const rows = ephRows();
    const cols = ['Sun', 'Moon', 'Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune', 'Pluto'];
    const evs = S.natal ? monthEvents(y, m) : K.skyEvents(K.dayStart(y, m, 1, TZ), K.addDays(K.dayStart(y, m, K.daysInMonth(y, m), TZ), 1), observer(), null, TZ);
    const ctx = K.monthContext(y, m, TZ);
    const phaseDays = new Set(evs.filter(e => e.cat === 'luna' && e.quarter != null).map(e => K.dateKey(e.date, TZ)));
    let t = `<table class="eph"><thead><tr><th>den</th>${cols.map(c => `<th title="${K.BODY_CZ[c]}">${K.BODY_GLYPH[c]}</th>`).join('')}<th title="střední uzel">☊</th></tr></thead><tbody>`;
    for (const r of rows) {
      const key = K.dateKey(r.date, TZ);
      t += `<tr class="${phaseDays.has(key) ? 'phase' : ''}"><td>${r.d}.</td>${cols.map(c => `<td>${K.fmtLon(r.pos[c].lon)}${r.pos[c].retro ? '<span class="r">R</span>' : ''}</td>`).join('')}<td>${K.fmtLon(r.pos.Node.lon)}</td></tr>`;
    }
    t += '</tbody></table>';
    const monthEvs = evs.filter(e => ['luna', 'planety', 'slunce', 'zatmeni'].includes(e.cat) && !(e.conj)).map(e => `<li><span class="g">${CAT_ICON[e.cat]}</span><span class="t">${esc(e.title)}<span class="n">${K.fmtDateCz(e.date, TZ)} ${K.fmtTime(e.date, TZ)}${e.note ? ' · ' + esc(e.note) : ''}</span></span></li>`).join('');

  function wheelSVG(n) {
    const cx = 180, cy = 180, R = 172, Rz = 150, Rh = 118, Rp = 100;
    const asc = n.points.Asc.lon;
    const ang = (lon) => (180 + (lon - asc)) * Math.PI / 180;
    const pt = (lon, r) => [cx + r * Math.cos(ang(lon)), cy - r * Math.sin(ang(lon))];
    let s = `<svg class="wheel" viewBox="0 0 360 360" role="img" aria-label="Nativní horoskop">`;
    s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="var(--wheel-bg)" stroke="var(--gold2)"/><circle cx="${cx}" cy="${cy}" r="${Rz}" fill="none" stroke="var(--line2)"/><circle cx="${cx}" cy="${cy}" r="${Rh}" fill="none" stroke="var(--line)"/>`;
    for (let i = 0; i < 12; i++) {
      const [x1, y1] = pt(i * 30, Rz), [x2, y2] = pt(i * 30, R); s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--line2)"/>`;
      const [gx, gy] = pt(i * 30 + 15, (R + Rz) / 2); s += `<text x="${gx}" y="${gy + 5}" text-anchor="middle" font-size="14" fill="var(--gold)" font-family="serif">${K.SIGN_GLYPH[i]}</text>`;
    }
    for (let h = 1; h <= 12; h++) {
      const [x1, y1] = pt(n.cusps[h], Rz), [x2, y2] = pt(n.cusps[h], h === 1 || h === 7 || h === 4 || h === 10 ? 20 : Rh);
      s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${h === 1 || h === 10 ? 'var(--gold)' : 'var(--line2)'}" stroke-width="${h === 1 || h === 10 ? 1.5 : 1}"/>`;
      const next = n.cusps[h === 12 ? 1 : h + 1]; const mid = n.cusps[h] + K.norm(next - n.cusps[h]) / 2; const [hx, hy] = pt(mid, Rh - 12);
      s += `<text x="${hx}" y="${hy + 3}" text-anchor="middle" font-size="9" fill="var(--muted)">${h}</text>`;
    }
    const keys = ['Sun', 'Moon', 'Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune', 'Pluto', 'Node'];
    const placed = keys.map(k => ({ k, lon: n.points[k].lon, disp: n.points[k].lon })).sort((a, b) => a.lon - b.lon);
    for (let iter = 0; iter < 12; iter++) for (let i = 0; i < placed.length; i++) { const a = placed[i], b = placed[(i + 1) % placed.length]; const d = K.norm(b.disp - a.disp); if (d < 8 && d >= 0) { a.disp = K.norm(a.disp - (8 - d) / 2); b.disp = K.norm(b.disp + (8 - d) / 2); } }
    for (const p of placed) {
      const [x, y] = pt(p.disp, Rp + 22), [tx, ty] = pt(p.lon, Rz), [lx, ly] = pt(p.lon, Rz - 8);
      s += `<line x1="${tx}" y1="${ty}" x2="${lx}" y2="${ly}" stroke="var(--gold)" stroke-width="1"/><text x="${x}" y="${y + 5}" text-anchor="middle" font-size="15" fill="var(--text)" font-family="serif">${K.BODY_GLYPH[p.k]}</text>`;
      const [dx, dy] = pt(p.disp, Rp + 2); s += `<text x="${dx}" y="${dy + 3}" text-anchor="middle" font-size="8" fill="var(--muted)">${Math.floor(K.degInSign(p.lon))}°</text>`;
    }
    for (const st of n.stars.filter(x => x.mine)) { const [x, y] = pt(st.lon, R + 0), [x2, y2] = pt(st.lon, R - 6); s += `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="var(--gold)" stroke-width="2"><title>${esc(st.name)}</title></line>`; }
    const [ax, ay] = pt(asc, R + 4); s += `<text x="${ax - 14}" y="${ay + 4}" font-size="10" fill="var(--gold)">Asc</text>`;
    const [mx, my] = pt(n.points.MC.lon, R + 4); s += `<text x="${mx}" y="${my - 4}" text-anchor="middle" font-size="10" fill="var(--gold)">MC</text>`;
    s += '</svg>';
    return s;
  }

    const [y, m, d] = date.split('-').map(Number), [hh, mm] = time.split(':').map(Number);
    const p = activeProfile();
    Object.assign(p, { name: $('[name=name]', f).value.trim() || 'profil', y, m, d, hh, mm, place: $('[name=place]', f).value.trim(), lat: +$('[name=lat]', f).value, lon: +$('[name=lon]', f).value, tz: TZ });
    persistProfiles(); computeNatal(); renderSettings(); toast('Nativ přepočítán.');
  }

  // ===================== obloha podle denní doby =====================
  // Zatím jen den a noc. Palety pro rozednívání a stmívání zůstávají v CSS —
  // až je budeme chtít, stačí je vrátit sem a do themeForNow.
  const THEMES = { day: 'den', night: 'noc' };
  const THEME_META = { day: '#0A4FA8', night: '#040A18' };
  function themeForNow(dt) {
    dt = dt || new Date();
    try {
      const p = K.tzParts(dt, TZ);
      const ph = K.planetaryHours(p.y, p.m, p.d, observer(), TZ);
      if (!ph) return 'night';
      const t = dt.getTime(), sr = ph.sunrise.getTime(), ss = ph.sunset.getTime();
      if (t >= sr - 40 * 60000 && t < ss + 40 * 60000) return 'day';
      return 'night';
    } catch (e) { return 'night'; }
  }
  function applyTheme() {
    document.documentElement.dataset.bg = settings.bg === 'plain' ? 'plain' : 'photo';
    const want = settings.theme === 'auto' ? themeForNow() : settings.theme;
    if (document.documentElement.dataset.theme !== want) {
      document.documentElement.dataset.theme = want;
      const mt = document.querySelector('meta[name=theme-color]');
      if (mt) mt.setAttribute('content', THEME_META[want] || '#111832');
    }
    return want;
  }

  // mraky pro světlé oblohy – široké pásy oparu, ne kaňky
  function drawClouds() {
    const svg = document.getElementById('clouds');
    if (!svg) return;
    if (settings.clouds === false) { svg.innerHTML = ''; return; }
    const W = 1000, H = 1600;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    let seed = 19800903, rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    let g = '<defs><filter id="cb" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="26"/></filter></defs><g filter="url(#cb)">';
    // pásy: nahoře řídké, u obzoru hustší – jako vrstevnatá oblačnost
    const bands = [0.10, 0.24, 0.40, 0.56, 0.70, 0.80, 0.88, 0.94];
    bands.forEach((by, i) => {
      const near = i / (bands.length - 1);
      const count = 2 + Math.round(near * 3);
      for (let j = 0; j < count; j++) {
        const cx = (0.08 + rnd() * 0.84) * W;
        const cy = (by + (rnd() - 0.5) * 0.035) * H;
        const rx = (110 + rnd() * 230) * (0.6 + near * 0.9);
        const ry = (12 + rnd() * 20) * (0.7 + near * 0.6);
        const o = (0.07 + near * 0.13 + rnd() * 0.05).toFixed(3);
        g += `<ellipse cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" rx="${rx.toFixed(0)}" ry="${ry.toFixed(0)}" fill="#fff" opacity="${o}"/>`;
      }
    });
    svg.innerHTML = g + '</g>';
  }

  // hvězdné pozadí – deterministické, jemné
  function drawStars() {
    const svg = document.getElementById('stars');
    if (!svg) return;
    const W = 1000, H = 1600;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    let seed = 20260903, rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    let g = '';
    for (let i = 0; i < 260; i++) {
      const x = (rnd() * W).toFixed(1), yy = (rnd() * H).toFixed(1), r = (rnd() * rnd() * 1.7 + 0.35).toFixed(2), o = (0.18 + rnd() * 0.55).toFixed(2);
      const gold = rnd() > 0.88;
      g += `<circle cx="${x}" cy="${yy}" r="${r}" fill="${gold ? 'var(--gold)' : 'var(--text)'}" opacity="${o}"/>`;
    }
    // pár jasnějších s jemnou září
    for (let i = 0; i < 7; i++) {
      const x = (rnd() * W).toFixed(1), yy = (rnd() * H * 0.7).toFixed(1);
      g += `<circle cx="${x}" cy="${yy}" r="${(2 + rnd()).toFixed(1)}" fill="var(--gold)" opacity=".55"/><circle cx="${x}" cy="${yy}" r="9" fill="var(--gold)" opacity=".07"/>`;
    }
    svg.innerHTML = g;
  }

  // ===================== start =====================
  applyTheme();
  computeNatal();
  setInterval(() => { if (settings.theme === 'auto') applyTheme(); }, 240000);
  showTab('kalendar');
  loadKp(false);
  document.addEventListener('change', (e) => {
    if (e.target && e.target.id === 'jFile' && e.target.files && e.target.files[0]) {
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const data = JSON.parse(fr.result);
          const ent = data.entries || data;
          let added = 0;
          for (const k of Object.keys(ent)) if (/^\d{4}-\d{2}-\d{2}$/.test(k)) { const cur = journal[k]; if (!cur || !cur.note) { journal[k] = ent[k]; added++; } }
          store.set('kairos_journal', journal);
          if (data.plan) { for (const k of Object.keys(data.plan)) if (/^\d{4}-\d{2}-\d{2}$/.test(k) && !plan[k]) plan[k] = data.plan[k]; pSave(); }
          let pl = 0;
          if (data.plan) for (const k of Object.keys(data.plan)) if (/^\d{4}-\d{2}-\d{2}$/.test(k) && !plan[k]) { plan[k] = data.plan[k]; pl++; }
          pSave();
          toast('Načteno ' + added + ' zápisů' + (pl ? ' a ' + pl + ' dnů plánu' : '') + '.');
          renderJournal();
        } catch (err) { toast('Soubor se nepodařilo přečíst.'); }
      };
      fr.readAsText(e.target.files[0]);
      e.target.value = '';
    }
  });
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installEvt = e; });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { const q = K.tzParts(new Date(), TZ); if (K.isoDate(q.y, q.m, q.d) !== TODAY_KEY) location.reload(); else if (S.tab === 'kalendar') renderCalendar(); } });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
  window.KAIROS = { K, S, settings, profiles };
})();

</script>
