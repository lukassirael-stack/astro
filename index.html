<script>(function(){try{var ks=JSON.parse(localStorage.getItem('kairos_state')||'null'),st=(ks&&ks.data&&ks.data.settings)||JSON.parse(localStorage.getItem('kairos_settings')||'{}'),t=st.theme||'auto';
if(t==='auto'||t==='dawn'||t==='dusk'){var n=new Date(),s=null;try{s=JSON.parse(localStorage.getItem('kairos_sun')||'null');}catch(e){}
var k=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
if(s&&s.k===k){var m=n.getTime();t=(m>=s.sr-2400000&&m<s.ss+2400000)?'day':'night';}else{var h=n.getHours();t=h>=6&&h<20?'day':'night';}}
document.documentElement.dataset.theme=t;
var c={day:'#0A4FA8',night:'#040A18'}[t];
var mt=document.querySelector('meta[name=theme-color]');if(mt)mt.setAttribute('content',c);}catch(e){}})();</script>
